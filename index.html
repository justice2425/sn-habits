<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Habits</title>
<style>
  :root {
    --bg:        var(--sn-stylekit-background-color, #ffffff);
    --fg:        var(--sn-stylekit-foreground-color, #1f2328);
    --panel:     var(--sn-stylekit-contrast-background-color, #f4f6f8);
    --panel-2:   var(--sn-stylekit-secondary-background-color, #ffffff);
    --border:    var(--sn-stylekit-border-color, #d8dce0);
    --muted:     var(--sn-stylekit-passive-color-1, #6b7177);
    --muted-2:   var(--sn-stylekit-passive-color-2, #9aa0a6);
    --accent:    var(--sn-stylekit-info-color, #2f6fed);
    --accent-fg: var(--sn-stylekit-info-contrast-color, #ffffff);
    --danger:    var(--sn-stylekit-danger-color, #e5484d);
    --success:   var(--sn-stylekit-success-color, #30a46c);
    --warning:   var(--sn-stylekit-warning-color, #c47900);
    --radius: 8px;
    --shadow: 0 6px 24px rgba(0,0,0,0.18);
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:14px; line-height:1.4; -webkit-font-smoothing:antialiased; }
  #app { display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  button,input,select,textarea { font-family:inherit; font-size:inherit; color:var(--fg); }
  button { background:transparent; border:1px solid transparent; color:var(--fg); border-radius:6px; padding:5px 10px; cursor:pointer; line-height:1.2; }
  button:hover { background:var(--panel-2); }
  button.primary { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
  button.ghost { border-color:var(--border); }
  button.danger { color:var(--danger); }
  input[type=text],input[type=number],input[type=date],select { background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:6px 8px; outline:none; width:100%; }
  input:focus,select:focus { border-color:var(--accent); }
  ::placeholder { color:var(--muted-2); }

  .toolbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:8px 12px; border-bottom:1px solid var(--border); background:var(--panel); }
  .toolbar .grow { flex:1 1 auto; }
  .seg { display:inline-flex; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
  .seg { flex-wrap:wrap; }
  .seg button { border-radius:0; border:none; padding:5px 10px; }
  .seg button.active { background:var(--accent); color:var(--accent-fg); }
  .subhead { padding:6px 14px 0; color:var(--muted); font-size:13px; }
  .surface { flex:1 1 auto; overflow:auto; padding:14px; }

  /* Today */
  .today { max-width:640px; margin:0 auto; }
  .hrow { display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--border); }
  .hrow:first-child { border-top:none; }
  .hicon { font-size:20px; width:24px; text-align:center; flex:0 0 auto; }
  .hname { flex:1 1 auto; }
  .hname .rest { color:var(--muted); font-size:12px; margin-left:6px; }
  .streak { display:inline-flex; align-items:center; gap:3px; font-size:12px; padding:2px 8px; border-radius:999px; background:rgba(196,121,0,.13); color:var(--warning); white-space:nowrap; }
  .check { width:28px; height:28px; border-radius:50%; border:2px solid var(--muted-2); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .check.done { background:var(--success); border-color:var(--success); color:#fff; }
  .check.done::after { content:"✓"; font-size:15px; }
  .counter { display:inline-flex; align-items:center; gap:6px; flex:0 0 auto; }
  .counter .val { min-width:54px; text-align:center; font-size:13px; }
  .counter button { border:1px solid var(--border); width:26px; height:26px; padding:0; border-radius:6px; }
  .pbar { height:6px; border-radius:999px; background:var(--panel); margin:8px 0 0 36px; overflow:hidden; }
  .pbar > span { display:block; height:100%; background:var(--accent); }
  .addhabit { margin-top:14px; }

  /* Grid */
  .grid-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .gridv { display:grid; gap:4px; align-items:center; width:max-content; }
  .gridv .gdow { text-align:center; font-size:10px; color:var(--muted-2); }
  .gridv .glabel { white-space:nowrap; padding-right:8px; font-size:13px; position:sticky; left:0; background:var(--bg); z-index:1; }
  .cell { width:18px; height:18px; border-radius:4px; background:var(--panel); border:1px solid var(--border); display:block; cursor:pointer; }
  .cell.done { border-color:transparent; }
  .cell.today { outline:2px solid var(--accent); outline-offset:-2px; }
  .cell.off { opacity:.35; cursor:default; }

  /* Stats */
  .stat-cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px; }
  .scard { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:12px 14px; }
  .scard h4 { margin:0 0 8px; font-size:14px; display:flex; align-items:center; gap:8px; }
  .smetrics { display:flex; gap:14px; flex-wrap:wrap; }
  .smetric .n { font-size:20px; font-weight:700; }
  .smetric .l { font-size:11px; color:var(--muted); }
  .wk { display:flex; gap:3px; margin-top:8px; }
  .wk span { width:14px; height:14px; border-radius:3px; background:var(--panel-2); border:1px solid var(--border); }
  .wk span.on { background:var(--success); border-color:var(--success); }

  /* Modal */
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:flex-start; justify-content:center; z-index:50; overflow:auto; padding:40px 16px; }
  .overlay.open { display:flex; }
  .modal { background:var(--bg); border:1px solid var(--border); border-radius:12px; width:100%; max-width:480px; box-shadow:var(--shadow); }
  .modal-head { display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--border); }
  .modal-body { padding:14px; display:flex; flex-direction:column; gap:12px; }
  .modal-foot { display:flex; justify-content:space-between; padding:12px 14px; border-top:1px solid var(--border); }
  .field label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; font-weight:600; }
  .field-row { display:flex; gap:10px; }
  .field-row > .field { flex:1; }
  .dows { display:flex; gap:5px; flex-wrap:wrap; }
  .dow-btn { border:1px solid var(--border); border-radius:6px; padding:5px 9px; cursor:pointer; }
  .dow-btn.on { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
  .iconpick { display:flex; gap:6px; flex-wrap:wrap; }
  .iconpick button { font-size:18px; border:1px solid var(--border); width:36px; height:34px; padding:0; }
  .iconpick button.on { border-color:var(--accent); background:var(--panel); }
  .swatches { display:flex; gap:6px; flex-wrap:wrap; }
  .swatches button { width:26px; height:26px; border-radius:50%; border:2px solid transparent; padding:0; }
  .swatches button.on { border-color:var(--fg); }
  .small { font-size:12px; color:var(--muted); }
  .empty { color:var(--muted); text-align:center; padding:40px 12px; }
  .iconbtn { padding:4px 6px; color:var(--muted); }
  .iconbtn:hover { color:var(--fg); }
  .streak.risk { background:rgba(229,72,77,.13); color:var(--danger); }
  .riskbanner { background:rgba(196,121,0,.13); color:var(--warning); border:1px solid var(--warning); border-radius:8px; padding:8px 10px; margin-bottom:12px; font-size:13px; }
  .medal { font-size:12px; color:var(--warning); margin-top:6px; }
  textarea { font-family:inherit; }

  .month-head { display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .month-title { font-weight:600; min-width:150px; }
  .month-head select { width:auto; margin-left:auto; }
  .cal { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; max-width:560px; }
  .cal-dow { text-align:center; font-size:11px; color:var(--muted-2); }
  .cal-cell { position:relative; border:1px solid var(--border); border-radius:6px; padding:4px; min-height:46px; }
  .cal-cell.empty { border:none; }
  .cal-cell.caltoday { outline:2px solid var(--accent); outline-offset:-2px; }
  .cal-cell.sched { border-style:dashed; }
  .cal-num { font-size:11px; color:var(--muted); position:relative; z-index:1; }
  .cal-cell.filled .cal-num { color:#fff; }
  .cal-fill { position:absolute; inset:0; background:var(--success); border-radius:5px; }

  .spark { display:flex; align-items:flex-end; gap:2px; height:30px; margin-top:8px; }
  .spark span { flex:1; border-radius:2px 2px 0 0; min-height:2px; }
  .cell.skip, .cal-cell.skip, .ycell.skip { background:repeating-linear-gradient(45deg, var(--panel), var(--panel) 3px, var(--border) 3px, var(--border) 4px); }
  .year-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .year { display:grid; grid-template-rows:repeat(7,12px); grid-auto-flow:column; grid-auto-columns:12px; gap:3px; width:max-content; }
  .ycell { width:12px; height:12px; border-radius:2px; background:var(--panel); border:1px solid var(--border); }
  .ymonths { display:flex; gap:3px; margin-bottom:4px; font-size:10px; color:var(--muted-2); }
  .journal .jhead { font-size:16px; font-weight:600; margin-bottom:4px; }
  .journal .jday { margin:14px 0 2px; font-size:12px; color:var(--muted); font-weight:600; }
  .journal .jitem { display:flex; gap:8px; padding:7px 0; border-top:1px solid var(--border); }
  .journal .ji-ic { width:20px; text-align:center; flex:0 0 auto; }
  .journal .ji-txt { flex:1; }
  .journal .ji-name { font-size:12px; color:var(--muted); }
  .journal .ji-edit { flex:0 0 auto; opacity:.35; font-size:13px; align-self:center; }
  .journal .jitem:hover .ji-edit { opacity:.9; }
  .insights { max-width:640px; }
  .ins-note { font-size:12px; color:var(--muted); margin-bottom:10px; }
  .ins-card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
  .ins-card h4 { margin:0 0 8px; font-size:14px; }
  .ins-card .small { margin:4px 0; }
  .ins-big { font-size:26px; font-weight:700; margin:2px 0; }
  .ins-trend { font-size:13px; font-weight:600; margin-left:6px; }
  .ins-trend.up { color:var(--success); } .ins-trend.down { color:var(--danger); } .ins-trend.steady { color:var(--muted); }
  .ins-row { display:flex; align-items:center; gap:8px; margin:5px 0; }
  .ins-rlbl { width:16px; font-size:12px; color:var(--muted); text-align:center; }
  .ins-hname { width:150px; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ins-bar { flex:1; height:8px; border-radius:999px; background:var(--bg); border:1px solid var(--border); overflow:hidden; }
  .ins-bar > span { display:block; height:100%; background:var(--accent); }
  .ins-rval { width:58px; text-align:right; font-size:12px; color:var(--muted); }
  .ins-weeks { display:flex; gap:8px; align-items:flex-end; }
  .ins-week { flex:1; text-align:center; }
  .ins-vbar { height:70px; display:flex; align-items:flex-end; background:var(--bg); border:1px solid var(--border); border-radius:5px; overflow:hidden; }
  .ins-vbar > span { display:block; width:100%; background:var(--accent); }
  .ins-wlbl { font-size:11px; margin-top:3px; } .ins-wlbl2 { font-size:10px; color:var(--muted); }
  .ins-cloud { display:flex; flex-wrap:wrap; gap:4px 10px; align-items:baseline; margin-top:4px; }
  .ins-word { line-height:1.2; }
  .ins-caveat { color:var(--muted-2,var(--muted)); font-style:italic; font-size:11px; }
  .restpill { font-size:12px; color:var(--muted); border:1px solid var(--border); border-radius:999px; padding:3px 10px; cursor:pointer; flex:0 0 auto; }
  .restpill.on { color:var(--accent); border-color:var(--accent); }
</style>
</head>
<body>
<div id="app">
  <div class="toolbar">
    <div class="seg" id="viewSeg">
      <button data-view="today">Today</button>
      <button data-view="grid">Grid</button>
      <button data-view="month">Month</button>
      <button data-view="year">Year</button>
      <button data-view="stats">Stats</button>
      <button data-view="insights">Insights</button>
      <button data-view="journal">Journal</button>
    </div>
    <span class="grow"></span>
    <button class="ghost" id="archBtn" style="display:none;">Archived</button>
    <button class="ghost" id="undoBtn" title="Undo (Ctrl/Cmd+Z)">↶ Undo</button>
    <button class="ghost" id="addBtn">+ Habit</button>
  </div>
  <div class="subhead" id="subhead"></div>
  <div class="surface" id="surface"></div>
</div>

<!-- Habit editor -->
<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <input id="h_name" type="text" placeholder="Habit name" />
      <button class="iconbtn" id="h_up" title="Move up">↑</button>
      <button class="iconbtn" id="h_down" title="Move down">↓</button>
      <button class="iconbtn" id="h_close" title="Close">✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Icon</label>
        <div class="iconpick" id="h_icons"></div>
      </div>
      <div class="field">
        <label>Color</label>
        <div class="swatches" id="h_colors"></div>
      </div>
      <div class="field">
        <label>Schedule</label>
        <select id="h_sched">
          <option value="daily">Every day</option>
          <option value="days">Specific weekdays</option>
          <option value="weekly">Weekly target</option>
        </select>
      </div>
      <div class="field" id="h_daysWrap" style="display:none;">
        <label>Days</label>
        <div class="dows" id="h_days"></div>
      </div>
      <div class="field" id="h_targetWrap" style="display:none;">
        <label>Times per week</label>
        <input id="h_target" type="number" min="1" max="7" value="3" />
      </div>
      <div class="field-row">
        <div class="field">
          <label>Tracking</label>
          <select id="h_track">
            <option value="check">Check off</option>
            <option value="count">Count toward a goal</option>
          </select>
        </div>
        <div class="field" id="h_goalWrap" style="display:none;">
          <label>Daily goal</label>
          <input id="h_goal" type="number" min="1" value="1" />
        </div>
        <div class="field" id="h_unitWrap" style="display:none;">
          <label>Unit</label>
          <input id="h_unit" type="text" placeholder="min, pages…" />
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="danger" id="h_delete">Delete</button>
      <span style="display:flex; gap:10px; align-items:center;">
        <button class="ghost" id="h_archive">Archive</button>
        <button class="primary" id="h_save">Save &amp; Close</button>
      </span>
    </div>
  </div>
</div>

<script>
"use strict";
/* ===========================================================================
   PART 1 — Standard Notes component bridge (vanilla port of the documented
   component-relay protocol). No build step, no dependencies.
   =========================================================================== */
const SNBridge = (function () {
  const Action = { StreamContextItem:'stream-context-item', SaveItems:'save-items',
    ComponentRegistered:'component-registered', ActivateThemes:'themes', ThemesActivated:'themes-activated', SetComponentData:'set-component-data' };
  const API_COMPONENT = 'component';
  let sessionKey=null, environment=null, platform=null, lastItem=null;
  const sentMessages=[], queue=[]; let activeThemes=[], onNote=null, saveTimer=null, saveDelay=250, standalone=false;
  function uuid(){ if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0,v=c==='x'?r:(r&0x3|0x8);return v.toString(16);}); }
  function isMobile(){ return environment==='mobile'; }
  function post(action,data,callback){ if(!sessionKey){ queue.push({action,data,callback}); return; }
    const message={action,data,messageId:uuid(),sessionKey,api:API_COMPONENT};
    const stored=JSON.parse(JSON.stringify(message)); stored.callback=callback; sentMessages.push(stored);
    window.parent.postMessage(isMobile()?JSON.stringify(message):message,'*'); }
  function handle(payload){ if(!payload||!payload.action) return;
    if(payload.action===Action.ComponentRegistered){ sessionKey=payload.sessionKey; const d=payload.data||{};
      environment=d.environment; platform=d.platform; const pend=queue.splice(0,queue.length); pend.forEach(m=>post(m.action,m.data,m.callback));
      activateThemes(d.activeThemeUrls||[]); post(Action.ThemesActivated,{}); post(Action.StreamContextItem,{},onStreamed); return; }
    if(payload.action===Action.ActivateThemes){ activateThemes((payload.data&&payload.data.themes)||[]); return; }
    if(!payload.original) return; const idx=sentMessages.findIndex(m=>m.messageId===payload.original.messageId);
    if(idx===-1) return; const o=sentMessages[idx]; if(o.callback) o.callback(payload.data); }
  function onStreamed(data){ const item=data&&data.item; if(!item) return; lastItem=item; if(item.isMetadataUpdate) return; if(onNote) onNote(text()); }
  function text(){ return (lastItem&&lastItem.content&&lastItem.content.text)||''; }
  function save(newText,previewText){ if(standalone) return; if(!lastItem) return; lastItem.content.text=newText;
    if(typeof previewText==='string') lastItem.content.preview_plain=previewText; if(saveTimer) clearTimeout(saveTimer); saveTimer=setTimeout(flush,saveDelay); }
  function flush(){ if(!lastItem) return; const copy=Object.assign({},lastItem); copy.children=null; copy.parent=null; post(Action.SaveItems,{items:[copy]}); }
  function activateThemes(urls){ if(activeThemes.sort().toString()===urls.slice().sort().toString()) return;
    Array.from(document.getElementsByClassName('sn-theme')).forEach(el=>el.remove());
    urls.forEach(url=>{ if(!url) return; const link=document.createElement('link'); link.className='sn-theme'; link.rel='stylesheet'; link.type='text/css'; link.href=url; document.head.appendChild(link); }); activeThemes=urls; }
  function listen(){ const onMsg=(event)=>{ let data=event.data; if(typeof data==='string'){ try{data=JSON.parse(data);}catch(e){return;} } handle(data); };
    window.addEventListener('message',onMsg,false); document.addEventListener('message',onMsg,false); }
  return { init(opts){ opts=opts||{}; saveDelay=typeof opts.debounceSave==='number'?opts.debounceSave:250; onNote=opts.onNote||null; listen();
      setTimeout(()=>{ if(!sessionKey){ standalone=true; if(opts.onStandalone) opts.onStandalone(); } },600); },
    save, flushNow:flush, isStandalone(){return standalone;} };
})();

/* ===========================================================================
   PART 2 — Habit tracker application. Data is JSON stored in the note text.
   =========================================================================== */
const App = (function () {
  const SCHEMA = 1;
  const COLORS = ['#2f6fed','#30a46c','#f5a623','#e5484d','#8e4ec6','#0aa5b8','#d6409f','#a18072'];
  const ICONS = ['🚴','💪','📖','✍️','🏃','🧘','💧','🥗','😴','🎸','🧹','💊','☀️','📵'];
  const MILESTONES = [7,14,30,60,100,180,365];

  let data=null, dirty=false, editingId=null, standalone=false;
  const undoStack=[]; let lastSerialized=null; let lastRenderDay=null;
  let monthOffset=0, monthHabit='';

  /* ---- persistence ---- */
  function id(){ return (window.crypto&&crypto.randomUUID)?crypto.randomUUID().slice(0,8):Math.random().toString(36).slice(2,10); }
  function defaultData(){
    const mk = (name,icon,color)=>({ id:id(), name, icon, color, schedule:{type:'daily'}, track:'check', goal:1, unit:'', archived:false, createdAt:new Date().toISOString() });
    return { schema:SCHEMA,
      habits:[ mk('Cycling','🚴',COLORS[0]), mk('Off-bike exercise','💪',COLORS[1]), mk('Reading','📖',COLORS[2]), mk('Writing','✍️',COLORS[3]) ],
      log:{}, notes:{}, ui:{ view:'today' } };
  }
  function load(text){
    let parsed=null; if(text&&text.trim()){ try{parsed=JSON.parse(text);}catch(e){parsed=null;} }
    if(!parsed||!Array.isArray(parsed.habits)) data=defaultData(); else data=migrate(parsed);
    if(standalone){ try{ const s=localStorage.getItem('sn-habits-standalone'); if(s) data=migrate(JSON.parse(s)); }catch(e){} }
    lastSerialized=JSON.stringify(data); undoStack.length=0; render();
  }
  function migrate(d){ d.schema=d.schema||1; d.habits=d.habits||[]; d.log=d.log||{}; d.notes=d.notes||{}; d.ui=d.ui||{view:'today'};
    d.habits.forEach(h=>{ h.schedule=h.schedule||{type:'daily'}; if(typeof h.archived==='undefined') h.archived=false; if(!h.track) h.track='check'; if(typeof h.goal==='undefined') h.goal=1; }); return d; }
  function saveOut(){ const t=JSON.stringify(data); lastSerialized=t; if(standalone){ try{localStorage.setItem('sn-habits-standalone',t);}catch(e){} return; } SNBridge.save(t, previewText()); }
  function persist(){ dirty=true; if(lastSerialized!==null){ const cur=JSON.stringify(data); if(cur!==lastSerialized){ undoStack.push(lastSerialized); if(undoStack.length>60) undoStack.shift(); } } saveOut(); }
  function undo(){ if(!undoStack.length) return; data=migrate(JSON.parse(undoStack.pop())); saveOut(); render(); }
  function previewText(){ const today=todayStr(); const act=data.habits.filter(h=>!h.archived);
    const done=act.filter(h=>scheduledOn(h,today)&&isDoneOn(h,today)).length; const due=act.filter(h=>scheduledOn(h,today)).length;
    return done+' / '+due+' habits done today · '+act.length+' tracked'; }

  /* ---- date helpers ---- */
  function todayStr(){ const d=new Date(); d.setHours(0,0,0,0); return toISODate(d); }
  function toISODate(d){ const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
  function addDays(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return toISODate(d); }
  function startOfWeek(iso){ const d=new Date(iso+'T00:00:00'); const off=(d.getDay()+6)%7; d.setDate(d.getDate()-off); return toISODate(d); } // Monday
  function fmtDate(iso){ return new Date(iso+'T00:00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}); }

  /* ---- habit logic ---- */
  function scheduledOn(h,iso){ const s=h.schedule||{type:'daily'};
    if(s.type==='days'){ const d=new Date(iso+'T00:00:00').getDay(); return (s.days||[]).includes(d); }
    return true; } // daily and weekly: every day is a candidate
  function logVal(h,iso){ return (data.log[h.id]||{})[iso]; }
  function isDoneOn(h,iso){ const v=logVal(h,iso); if(h.track==='count') return (typeof v==='number')&&v>=(h.goal||1); return v===true; }
  function setLog(h,iso,value){ const m=data.log[h.id]=data.log[h.id]||{}; if(value===false||value==null||value===0) delete m[iso]; else m[iso]=value;
    if(Object.keys(m).length===0) delete data.log[h.id]; }
  function toggleCheck(h,iso){ setLog(h,iso, logVal(h,iso)===true?false:true); }
  function incCount(h,iso,delta){ const cur=(typeof logVal(h,iso)==='number')?logVal(h,iso):0; setLog(h,iso,Math.max(0,cur+delta)); }
  function countInWeek(h,weekStart){ let c=0; const today=todayStr(); for(let i=0;i<7;i++){ const d=addDays(weekStart,i); if(d<=today&&isDoneOn(h,d)) c++; } return c; }

  function currentStreak(h){
    const today=todayStr();
    if((h.schedule||{}).type==='weekly'){
      const target=(h.schedule.target)||1; let streak=0; let wk=startOfWeek(today);
      if(countInWeek(h,wk)>=target) streak++;
      let prev=addDays(wk,-7); while(true){ if(countInWeek(h,prev)>=target){ streak++; prev=addDays(prev,-7); } else break; } return streak;
    }
    let streak=0; let cursor=today;
    while(true){ if(scheduledOn(h,cursor)){ if(isDoneOn(h,cursor)) streak++; else if(isSkipped(h,cursor)){ /* rest day, neutral */ } else if(cursor===today){ /* today pending */ } else break; }
      cursor=addDays(cursor,-1); if(cursor<'2000-01-01') break; }
    return streak;
  }
  function longestStreak(h){
    const today=todayStr(); const logDates=Object.keys(data.log[h.id]||{});
    if((h.schedule||{}).type==='weekly'){ if(!logDates.length) return 0; const target=(h.schedule.target)||1;
      let wk=startOfWeek(logDates.reduce((a,b)=>a<b?a:b)); const end=startOfWeek(today); let best=0,run=0;
      while(wk<=end){ if(countInWeek(h,wk)>=target){ run++; best=Math.max(best,run);} else run=0; wk=addDays(wk,7); } return best; }
    // Start from the earliest day that actually has history (a backfilled day can be
    // earlier than createdAt), so streaks that began before the habit was created still count.
    const logMin = logDates.length ? logDates.reduce((a,b)=>a<b?a:b) : today;
    const created = h.createdAt ? h.createdAt.slice(0,10) : logMin;
    const start = logMin < created ? logMin : created;
    let best=0,run=0,d=start; while(d<=today){ if(scheduledOn(h,d)){ if(isDoneOn(h,d)){ run++; best=Math.max(best,run);} else if(isSkipped(h,d)){ /* neutral */ } else run=0; } d=addDays(d,1); } return best;
  }
  function completionRate(h,days){ const today=todayStr(); let sched=0,done=0;
    for(let i=0;i<days;i++){ const d=addDays(today,-i); if(scheduledOn(h,d) && !isSkipped(h,d)){ sched++; if(isDoneOn(h,d)) done++; } } return sched?Math.round(done/sched*100):0; }
  function totalDone(h){ const m=data.log[h.id]||{}; return Object.keys(m).filter(k=>isDoneOn(h,k)).length; }
  function isSkipped(h,iso){ return logVal(h,iso)==='skip'; }
  function sumInRange(h,days){ const today=todayStr(); let s=0,n=0; for(let i=0;i<days;i++){ const v=logVal(h,addDays(today,-i)); if(typeof v==='number'){ s+=v; n++; } } return {sum:s,activeDays:n}; }
  function monthTotal(h){ const ym=todayStr().slice(0,7); const m=data.log[h.id]||{}; let s=0; Object.keys(m).forEach(k=>{ if(k.slice(0,7)===ym && typeof m[k]==='number') s+=m[k]; }); return s; }
  function sparkline(h,days){ const today=todayStr(); const vals=[]; for(let i=days-1;i>=0;i--){ const v=logVal(h,addDays(today,-i)); vals.push(typeof v==='number'?v:0); }
    const max=Math.max(1,...vals); const wrap=el('div','spark'); wrap.title='Last '+days+' days';
    vals.forEach(v=>{ const sp=el('span'); sp.style.height=Math.max(2,Math.round(v/max*30))+'px'; sp.style.background=v>0?safeColor(h.color,'var(--accent)'):'var(--border)'; wrap.appendChild(sp); });
    return wrap; }
  // "due on a specific day" — excludes weekly-target habits (which aren't pinned to a day)
  function dueOnStrict(h,iso){ const s=h.schedule||{type:'daily'}; if(s.type==='weekly') return false; if(s.type==='days'){ const w=new Date(iso+'T00:00:00').getDay(); return (s.days||[]).includes(w); } return true; }
  function perfectDaysCount(days){ const today=todayStr(); const act=data.habits.filter(h=>!h.archived); let n=0;
    for(let i=0;i<days;i++){ const d=addDays(today,-i); const due=act.filter(h=>dueOnStrict(h,d)); if(due.length && due.every(h=>isDoneOn(h,d))) n++; } return n; }
  function moveHabit(hid,dir){ const i=data.habits.findIndex(h=>h.id===hid); const j=i+dir; if(i<0||j<0||j>=data.habits.length) return; const a=data.habits; const t=a[i]; a[i]=a[j]; a[j]=t; persist(); render(); }
  // streak at risk = scheduled today, not done yet, and an active streak that today would break
  function atRisk(h){ const today=todayStr(); if((h.schedule||{}).type==='weekly') return false; if(!scheduledOn(h,today)) return false; if(isSkipped(h,today)) return false; if(isDoneOn(h,today)) return false; return currentStreak(h)>=2; }
  function highestMilestone(streak){ let m=0; MILESTONES.forEach(x=>{ if(streak>=x) m=x; }); return m; }
  function noteFor(hid,iso){ return (data.notes[hid]||{})[iso]||''; }

  /* ---- Insights: quantitative trends (all local, no AI) ---- */
  function activeHabits(){ return data.habits.filter(h=>!h.archived); }
  function firstLogDate(){ let min=null; Object.keys(data.log||{}).forEach(hid=>Object.keys(data.log[hid]||{}).forEach(d=>{ if(d!=='skip' && (!min||d<min)) min=d; })); return min; }
  function historyDays(){ const f=firstLogDate(); if(!f) return 0; return Math.round((new Date(todayStr()+'T00:00:00')-new Date(f+'T00:00:00'))/86400000)+1; }
  // combined completion over `len` days ending `offset` days before today (offset 0 = last `len` days incl today)
  function combinedRate(offset,len){ const today=todayStr(); let sched=0,done=0; const act=activeHabits();
    for(let i=0;i<len;i++){ const d=addDays(today,-(offset+i)); act.forEach(h=>{ if(scheduledOn(h,d)&&!isSkipped(h,d)){ sched++; if(isDoneOn(h,d)) done++; } }); }
    return { sched, done, rate: sched?Math.round(done/sched*100):null }; }
  function weeklyRates(nWeeks){ const arr=[]; for(let w=0;w<nWeeks;w++) arr.push(combinedRate(w*7,7)); return arr.reverse(); }
  function dowRates(nDays){ const today=todayStr(); const b=Array.from({length:7},()=>({sched:0,done:0})); const act=activeHabits();
    for(let i=0;i<nDays;i++){ const d=addDays(today,-i); const dow=(new Date(d+'T00:00:00').getDay()+6)%7;
      act.forEach(h=>{ if(scheduledOn(h,d)&&!isSkipped(h,d)){ b[dow].sched++; if(isDoneOn(h,d)) b[dow].done++; } }); }
    return b.map(x=>({sched:x.sched,done:x.done,rate:x.sched?Math.round(x.done/x.sched*100):null})); }
  function rateBack(h,fromOffset,len){ const today=todayStr(); let s=0,dn=0; for(let i=0;i<len;i++){ const d=addDays(today,-(fromOffset+i)); if(scheduledOn(h,d)&&!isSkipped(h,d)){ s++; if(isDoneOn(h,d)) dn++; } } return s?Math.round(dn/s*100):null; }
  function habitMomentum(h){ const recent=rateBack(h,0,14), prior=rateBack(h,14,14); let dir='steady';
    if(recent!=null&&prior!=null){ const diff=recent-prior; dir=diff>=10?'up':diff<=-10?'down':'steady'; } else if(recent!=null&&prior==null){ dir='new'; }
    return { recent, prior, dir }; }
  function coOccur(a,b,nDays){ const today=todayStr(); let aDone=0,both=0; for(let i=0;i<nDays;i++){ const d=addDays(today,-i); if(scheduledOn(a,d)&&scheduledOn(b,d)&&isDoneOn(a,d)){ aDone++; if(isDoneOn(b,d)) both++; } } return { aDone, both, pct: aDone?Math.round(both/aDone*100):null }; }
  function bestPairing(nDays){ const act=activeHabits(); let best=null; for(let i=0;i<act.length;i++) for(let j=0;j<act.length;j++){ if(i===j) continue; const c=coOccur(act[i],act[j],nDays); if(c.aDone>=4 && c.pct!=null && (!best||c.pct>best.pct)) best={a:act[i],b:act[j],pct:c.pct,aDone:c.aDone}; } return best; }
  function skipCount(nDays){ const today=todayStr(); let n=0; const act=activeHabits(); for(let i=0;i<nDays;i++){ const d=addDays(today,-i); act.forEach(h=>{ if(isSkipped(h,d)) n++; }); } return n; }

  /* ---- Insights: journal text stats (word-counting, not AI understanding) ---- */
  const STOPWORDS=new Set('the a an and or but of to in on for with at by from is are was were be been being it its this that these those i you he she we they them me my your his her our their as so if then than too very just really not no yes do did done doing have has had will would can could should about out up down off over more most some any all also into what when where which who how why got get went day today day tomorrow yesterday felt feel feeling still even much many because went'.split(/\s+/));
  function journalEntries(){ const out=[]; Object.keys(data.notes||{}).forEach(hid=>{ const m=data.notes[hid]||{}; Object.keys(m).forEach(date=>{ if((m[date]||'').trim()) out.push({hid,date,text:m[date]}); }); }); return out; }
  function tokenize(t){ return String(t||'').toLowerCase().replace(/[^a-z0-9'\s]/g,' ').split(/\s+/).map(w=>w.replace(/^'+|'+$/g,'')).filter(Boolean); }
  const POSW='good great love loved enjoy enjoyed happy strong proud calm focused focus progress win won better best easy easier motivated energized grateful clear rested rest fun excited consistent improving'.split(' ');
  const NEGW='bad tired hard tough struggle struggled skip skipped missed miss sore pain painful stressed anxious frustrated fail failed slow weak difficult exhausted overwhelmed sick lazy behind unmotivated distracted'.split(' ');
  function journalStats(){ const entries=journalEntries(); if(!entries.length) return null;
    const dates=[...new Set(entries.map(e=>e.date))].sort();
    let words=0; const freq={}; let pos=0,neg=0; const perHabit={};
    entries.forEach(e=>{ const toks=tokenize(e.text); words+=toks.length; perHabit[e.hid]=(perHabit[e.hid]||0)+1;
      toks.forEach(w=>{ if(POSW.includes(w)) pos++; if(NEGW.includes(w)) neg++; if(w.length>=3 && !STOPWORDS.has(w) && !/^\d+$/.test(w)) freq[w]=(freq[w]||0)+1; }); });
    const top=Object.entries(freq).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,15).map(x=>({w:x[0],n:x[1]}));
    let topHabit=null,topN=0; Object.keys(perHabit).forEach(hid=>{ if(perHabit[hid]>topN){ topN=perHabit[hid]; topHabit=hid; } });
    return { count:entries.length, days:dates.length, first:dates[0], last:dates[dates.length-1], words, avg:Math.round(words/entries.length), top, pos, neg, topHabit, topN }; }

  /* ---- Optional: package data + journal as plain text to paste into an AI ---- */
  function buildAIExport(){ const act=activeHabits(); const today=todayStr(); const L=[];
    L.push('You are helping me reflect on my habits and journal. Please read the data below and give me: (1) honest observations about my trends, (2) any patterns linking my habits to how I described my days, and (3) two or three concrete, kind suggestions. Be rigorous and specific; do not flatter me.');
    L.push(''); L.push('=== HABIT DATA (as of '+today+') ===');
    const r14=combinedRate(0,14), p14=combinedRate(14,14);
    L.push('Overall completion of scheduled habits, last 14 days: '+(r14.rate==null?'n/a':r14.rate+'%')+(p14.rate!=null?(' (prior 14 days: '+p14.rate+'%)'):''));
    const dw=dowRates(56); const names=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    L.push('Completion by weekday (last 8 weeks): '+dw.map((x,i)=>names[i]+' '+(x.rate==null?'-':x.rate+'%')).join(', '));
    L.push(''); L.push('Per habit:');
    act.forEach(h=>{ const m=habitMomentum(h); L.push('- '+h.name+': current streak '+currentStreak(h)+', longest '+longestStreak(h)+', 30-day '+completionRate(h,30)+'%, recent 14d '+(m.recent==null?'-':m.recent+'% ('+m.dir+')')+(h.track==='count'?(', count habit measured in '+(h.unit||'units')):'')); });
    const pair=bestPairing(60); if(pair){ L.push(''); L.push('Co-occurrence: on days I complete '+pair.a.name+', I also complete '+pair.b.name+' '+pair.pct+'% of the time (association, not necessarily cause).'); }
    L.push('Rest/skip days used in the last 30: '+skipCount(30)+'.');
    L.push('Perfect days in the last 30: '+perfectDaysCount(30)+'.');
    L.push(''); L.push('=== JOURNAL ENTRIES ===');
    const entries=journalEntries().sort((a,b)=>a.date.localeCompare(b.date));
    if(!entries.length) L.push('(none yet)');
    entries.forEach(e=>{ const h=data.habits.find(x=>x.id===e.hid); L.push('['+e.date+'] '+(h?h.name:'?')+': '+e.text); });
    return L.join('\n'); }
  function copyText(text,ok){ let done=false; if(window.navigator&&navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(()=>{done=true;ok&&ok(true);}).catch(fallback); } else fallback();
    function fallback(){ try{ const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }catch(e){} if(!done) ok&&ok(false); } }

  /* ---- rendering ---- */
  const $=s=>document.querySelector(s);
  const el=(tag,cls,html)=>{ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; };
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  // Only allow a hex color or a CSS var into style attributes / properties. Blocks
  // anything injected via a hand-edited note (e.g. a value that breaks out of the attribute).
  function safeColor(c,fallback){ c=String(c==null?'':c); return (/^#[0-9a-fA-F]{3,8}$/.test(c)||/^var\(--[a-zA-Z0-9-]+\)$/.test(c))?c:(fallback||'var(--accent)'); }

  function render(){
    if(!data) return;
    document.querySelectorAll('#viewSeg button').forEach(b=>b.classList.toggle('active', b.dataset.view===data.ui.view));
    const ub=$('#undoBtn'); if(ub){ ub.disabled=!undoStack.length; ub.style.opacity=undoStack.length?'1':'.4'; }
    const today=todayStr(); const act=data.habits.filter(h=>!h.archived);
    const due=act.filter(h=>scheduledOn(h,today)&&!isSkipped(h,today)); const done=due.filter(h=>isDoneOn(h,today));
    let sh = fmtDate(today) + '  ·  ' + done.length + ' of ' + due.length + ' done today';
    if(due.length && done.length===due.length) sh += '  ·  🎉 perfect day';
    $('#subhead').textContent = sh;
    const arch=data.habits.filter(h=>h.archived); const ab=$('#archBtn');
    if(ab){ if(arch.length){ ab.style.display=''; ab.textContent='Archived ('+arch.length+')'; } else ab.style.display='none'; }
    lastRenderDay = today;
    const s=$('#surface'); s.innerHTML='';
    if(data.ui.view==='grid') s.appendChild(renderGrid());
    else if(data.ui.view==='month') s.appendChild(renderMonth());
    else if(data.ui.view==='year') s.appendChild(renderYear());
    else if(data.ui.view==='journal') s.appendChild(renderJournal());
    else if(data.ui.view==='stats') s.appendChild(renderStats());
    else if(data.ui.view==='insights') s.appendChild(renderInsights());
    else s.appendChild(renderToday());
  }

  function renderToday(){
    const wrap=el('div','today'); const today=todayStr();
    const act=data.habits.filter(h=>!h.archived);
    if(!act.length){ wrap.appendChild(el('div','empty','No habits yet. Use “+ Habit” to add one.')); return wrap; }
    const risk=act.filter(atRisk);
    if(risk.length){ wrap.appendChild(el('div','riskbanner','⚠️ '+risk.length+' streak'+(risk.length>1?'s':'')+' at risk today — do them to keep your run.')); }
    act.forEach(h=>{
      const row=el('div','hrow');
      const ic=el('div','hicon'); ic.textContent=h.icon||'•'; ic.style.color=safeColor(h.color,'var(--fg)');
      const scheduled=scheduledOn(h,today);
      const name=el('div','hname'); name.innerHTML=esc(h.name)+(scheduled?'':'<span class="rest">rest day</span>');
      const streak=currentStreak(h); const risky=atRisk(h);
      const sb=el('span','streak'+(risky?' risk':''),'🔥 '+streak); sb.title=risky?'Do it today to keep your streak':'Current streak';
      row.appendChild(ic); row.appendChild(name); if(streak>0) row.appendChild(sb);
      const eb=el('button','ghost','✎'); eb.title='Edit / rename / delete this habit'; eb.style.cssText='flex:0 0 auto; padding:3px 8px;';
      eb.onclick=(e)=>{ e.stopPropagation(); openEditor(h.id); }; row.appendChild(eb);
      const hasNote=!!noteFor(h.id,today);
      const nb=el('button','ghost'); nb.textContent = hasNote ? '📝 Note' : '📝';
      nb.title = hasNote ? "Edit today's note / rest day" : 'Add a note or mark a rest day';
      nb.style.cssText = 'flex:0 0 auto; padding:3px 8px;' + (hasNote ? ' border-color:var(--accent); color:var(--accent);' : '');
      nb.onclick=(e)=>{ e.stopPropagation(); openDay(h.id,today); }; row.appendChild(nb);
      const celebrateIf=(prev)=>{ const now=currentStreak(h); if(now>prev && MILESTONES.includes(now)) celebrate(h,now); };
      if(isSkipped(h,today)){
        const rp=el('span','restpill on','💤 rest'); rp.title='Rest day — tap to change'; rp.onclick=(e)=>{ e.stopPropagation(); openDay(h.id,today); }; row.appendChild(rp);
      } else if(h.track==='count'){

        const val=el('span','val', v+' / '+(h.goal||1)+(h.unit?(' '+esc(h.unit)):''));
        const plus=el('button',null,'+'); plus.onclick=()=>{ const prev=currentStreak(h); incCount(h,today,1); persist(); render(); celebrateIf(prev); };

      } else {
        const chk=el('div','check'+(isDoneOn(h,today)?' done':'')); chk.onclick=()=>{ const prev=currentStreak(h); toggleCheck(h,today); persist(); render(); celebrateIf(prev); };
        row.appendChild(chk);

      name.onclick=()=>openEditor(h.id);
      ic.onclick=()=>openEditor(h.id);
      wrap.appendChild(row);
      if(h.track==='count' && !isSkipped(h,today)){ const v=(typeof logVal(h,today)==='number')?logVal(h,today):0; const pct=Math.min(100,Math.round(v/(h.goal||1)*100));
        const pb=el('div','pbar','<span style="width:'+pct+'%; background:'+safeColor(h.color,'var(--accent)')+'"></span>'); wrap.appendChild(pb); }
    });
    return wrap;
  }

    const daysInMonth=new Date(year,mon+1,0).getDate();

      const cell=el('div','cal-cell'+(dstr===today?' caltoday':''));

    arch.forEach(h=>{
      const row=el('div','hrow');
      const ic=el('div','hicon'); ic.textContent=h.icon||'•'; ic.style.color=safeColor(h.color,'var(--fg)');
      row.appendChild(ic); row.appendChild(el('div','hname',esc(h.name)));
      const un=el('button','ghost','Unarchive'); un.onclick=()=>{ h.archived=false; persist(); ov.remove(); render(); };
      const del=el('button','danger','Delete'); del.onclick=()=>{ const tid=h.id; ov.remove();
        uiConfirm('Delete this habit and its history?', ()=>{ data.habits=data.habits.filter(x=>x.id!==tid); delete data.log[tid]; persist(); render(); }); };
      row.appendChild(un); row.appendChild(del); body.appendChild(row);
    });
    box.appendChild(head); box.appendChild(body); ov.appendChild(box); document.body.appendChild(ov);
    ov.addEventListener('mousedown',e=>{ if(e.target===ov) ov.remove(); });
  }

  function uiConfirm(message,onYes){
    const ov=el('div','overlay'); ov.style.display='flex'; ov.style.zIndex='100';
    const box=el('div','modal'); box.style.maxWidth='360px';
    box.appendChild(el('div','modal-body','<div>'+esc(message)+'</div>'));
    const foot=el('div','modal-foot'); foot.style.justifyContent='flex-end'; foot.style.gap='8px';
    const cancel=el('button','ghost','Cancel'); const yes=el('button','primary','Delete'); yes.style.background='var(--danger)'; yes.style.borderColor='var(--danger)';
    foot.appendChild(cancel); foot.appendChild(yes); box.appendChild(foot); ov.appendChild(box); document.body.appendChild(ov);
    cancel.onclick=()=>ov.remove(); ov.addEventListener('mousedown',e=>{ if(e.target===ov) ov.remove(); }); yes.onclick=()=>{ ov.remove(); onYes(); };
  }

  return { start(){ wire(); SNBridge.init({ debounceSave:250, onNote:(text)=>{ standalone=false; load(text); }, onStandalone:()=>{ standalone=true; load(''); } }); },
    _test:{ combinedRate, weeklyRates, dowRates, habitMomentum, coOccur, bestPairing, skipCount, journalStats, historyDays, buildAIExport, currentStreak, longestStreak, completionRate, addDays, todayStr, _set:(d)=>{data=d;} } };
})();

document.addEventListener('DOMContentLoaded', App.start);
</script>
</body>
</html>
