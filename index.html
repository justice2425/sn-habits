 out their fan,\nTo catch the breezy air;\nAnd I must think, do all I can,\nThat there was pleasure there.\n\nIf I these thoughts may not prevent,\nIf such be of my creed the plan,\nHave I not reason to lament\nWhat man has made of man?","w":"Published 1798 in Lyrical Ballads, written with Coleridge.","b":"Lyrical Ballads set out to write poetry in the language ordinary people really used.","r":"Sitting in a grove full of joy, he grieves at the contrast with “what man has made of man.”","s":"9622"},{"id":"k_autumn","t":"To Autumn","a":"keats","x":"Season of mists and mellow fruitfulness,\n  Close bosom-friend of the maturing sun;\nConspiring with him how to load and bless\n  With fruit the vines that round the thatch-eves run;\nTo bend with apples the moss'd cottage-trees,\n  And fill all fruit with ripeness to the core;\n    To swell the gourd, and plump the hazel shells\nWith a sweet kernel; to set budding more,\n  And still more, later flowers for the bees,\n  Until they think warm days will never cease,\n    For Summer has o'er-brimm'd their clammy cells.\n\nWho hath not seen thee oft amid thy store?\n  Sometimes whoever seeks abroad may find\nThee sitting careless on a granary floor,\n  Thy hair soft-lifted by the winnowing wind;\nOr on a half-reap'd furrow sound asleep,\n  Drows'd with the fume of poppies, while thy hook\n    Spares the next swath and all its twined flowers:\nAnd sometimes like a gleaner thou dost keep\n  Steady thy laden head across a brook;\n  Or by a cyder-press, with patient look,\n    Thou watchest the last oozings hours by hours.\n\nWhere are the songs of Spring? Ay, where are they?\n  Think not of them, thou hast thy music too,—\nWhile barred clouds bloom the soft-dying day,\n  And touch the stubble-plains with rosy hue;\nThen in a wailful choir the small gnats mourn\n  Among the river sallows, borne aloft\n    Or sinking as the light wind lives or dies;\nAnd full-grown lambs loud bleat from hilly bourn;\n  Hedge-crickets sing; and now with treble soft\n  The red-breast whistles from a garden-croft;\n    And gathering swallows twitter in the skies.","w":"Written in September 1819 after a walk near Winchester; published 1820.","b":"Keats described the walk in a letter: the stubble fields looked warm to him, “as some pictures look warm.” He was 23, and died of tuberculosis less than eighteen months later.","r":"Autumn is a person dozing in the fields, a gleaner, a patient watcher at the cider press. The poem accepts endings without complaint.","s":"23684"},{"id":"k_urn","t":"Ode on a Grecian Urn","a":"keats","x":"Thou still unravish'd bride of quietness,\n  Thou foster-child of silence and slow time,\nSylvan historian, who canst thus express\n  A flowery tale more sweetly than our rhyme:\nWhat leaf-fring'd legend haunts about thy shape\n  Of deities or mortals, or of both,\n    In Tempe or the dales of Arcady?\n  What men or gods are these? What maidens loth?\nWhat mad pursuit? What struggle to escape?\n    What pipes and timbrels? What wild ecstasy?\n\nHeard melodies are sweet, but those unheard\n  Are sweeter; therefore, ye soft pipes, play on;\nNot to the sensual ear, but, more endear'd,\n  Pipe to the spirit ditties of no tone:\nFair youth, beneath the trees, thou canst not leave\n  Thy song, nor ever can those trees be bare;\n    Bold Lover, never, never canst thou kiss,\nThough winning near the goal—yet, do not grieve;\n  She cannot fade, though thou hast not thy bliss,\n    For ever wilt thou love, and she be fair!\n\nAh, happy, happy boughs! that cannot shed\n  Your leaves, nor ever bid the Spring adieu;\nAnd, happy melodist, unwearied,\n  For ever piping songs for ever new;\nMore happy love! more happy, happy love!\n  For ever warm and still to be enjoy'd,\n    For ever panting, and for ever young;\nAll breathing human passion far above,\n  That leaves a heart high-sorrowful and cloy'd,\n    A burning forehead, and a parching tongue.\n\nWho are these coming to the sacrifice?\n  To what green altar, O mysterious priest,\nLead'st thou that heifer lowing at the skies,\n  And all her silken flanks with garlands drest?\nWhat little town by river or sea shore,\n  Or mountain-built with peaceful citadel,\n    Is emptied of this folk, this pious morn?\nAnd, little town, thy streets for evermore\n  Will silent be; and not a soul to tell\n    Why thou art desolate, can e'er return.\n\nO Attic shape! Fair attitude! with brede\n  Of marble men and maidens overwrought,\nWith forest branches and the trodden weed;\n  Thou, silent form, dost tease us out of thought\nAs doth eternity: Cold Pastoral!\n  When old age shall this generation waste,\n    Thou shalt remain, in midst of other woe\nThan ours, a friend to man, to whom thou say'st,\n  \"Beauty is truth, truth beauty,\"—that is all\n    Ye know on earth, and all ye need to know.","w":"Written in spring 1819; published 1820.","b":"Its final lines, “Beauty is truth, truth beauty,” are among the most argued-over in English poetry, including who is meant to be speaking them.","r":"The lovers on the urn will never kiss, but will also never stop loving. Art freezes a moment, and the poem weighs the gain against the loss.","s":"23684"},{"id":"k_melan","t":"Ode on Melancholy","a":"keats","x":"No, no, go not to Lethe, neither twist\n  Wolf's-bane, tight-rooted, for its poisonous wine;\nNor suffer thy pale forehead to be kiss'd\n  By nightshade, ruby grape of Proserpine;\nMake not your rosary of yew-berries,\n  Nor let the beetle, nor the death-moth be\n    Your mournful Psyche, nor the downy owl\nA partner in your sorrow's mysteries;\n  For shade to shade will come too drowsily,\n    And drown the wakeful anguish of the soul.\n\nBut when the melancholy fit shall fall\n  Sudden from heaven like a weeping cloud,\nThat fosters the droop-headed flowers all,\n  And hides the green hill in an April shroud;\nThen glut thy sorrow on a morning rose,\n  Or on the rainbow of the salt sand-wave,\n    Or on the wealth of globed peonies;\nOr if thy mistress some rich anger shows,\n  Emprison her soft hand, and let her rave,\n    And feed deep, deep upon her peerless eyes.\n\nShe dwells with Beauty—Beauty that must die;\n  And Joy, whose hand is ever at his lips\nBidding adieu; and aching Pleasure nigh,\n  Turning to poison while the bee-mouth sips:\nAy, in the very temple of Delight\n  Veil'd Melancholy has her sovran shrine,\n    Though seen of none save him whose strenuous tongue\nCan burst Joy's grape against his palate fine;\n  His soul shall taste the sadness of her might,\n    And be among her cloudy trophies hung.","w":"Written in 1819; published 1820.","b":"One of the great odes Keats wrote in a single extraordinary spring.","r":"Don't run from sadness into numbness; feed it on beauty. Melancholy lives right inside delight, and only those who taste joy fully meet her.","s":"23684"},{"id":"k_night","t":"Ode to a Nightingale","a":"keats","x":"My heart aches, and a drowsy numbness pains\n  My sense, as though of hemlock I had drunk,\nOr emptied some dull opiate to the drains\n  One minute past, and Lethe-wards had sunk:\n'Tis not through envy of thy happy lot,\n  But being too happy in thine happiness,—\n    That thou, light-winged Dryad of the trees,\n        In some melodious plot\n  Of beechen green, and shadows numberless,\n    Singest of summer in full-throated ease.\n\nO, for a draught of vintage! that hath been\n  Cool'd a long age in the deep-delved earth,\nTasting of Flora and the country green,\n  Dance, and Provençal song, and sunburnt mirth!\nO for a beaker full of the warm South,\n  Full of the true, the blushful Hippocrene,\n    With beaded bubbles winking at the brim,\n        And purple-stained mouth;\n  That I might drink, and leave the world unseen,\n    And with thee fade away into the forest dim:\n\nFade far away, dissolve, and quite forget\n  What thou among the leaves hast never known,\nThe weariness, the fever, and the fret\n  Here, where men sit and hear each other groan;\nWhere palsy shakes a few, sad, last gray hairs,\n  Where youth grows pale, and spectre-thin, and dies;\n    Where but to think is to be full of sorrow\n        And leaden-eyed despairs,\n  Where Beauty cannot keep her lustrous eyes,\n    Or new Love pine at them beyond to-morrow.\n\nAway! away! for I will fly to thee,\n  Not charioted by Bacchus and his pards,\nBut on the viewless wings of Poesy,\n  Though the dull brain perplexes and retards:\nAlready with thee! tender is the night,\n  And haply the Queen-Moon is on her throne,\n    Cluster'd around by all her starry Fays;\n        But here there is no light,\n  Save what from heaven is with the breezes blown\n    Through verdurous glooms and winding mossy ways.\n\nI cannot see what flowers are at my feet,\n  Nor what soft incense hangs upon the boughs,\nBut, in embalmed darkness, guess each sweet\n  Wherewith the seasonable month endows\nThe grass, the thicket, and the fruit-tree wild;\n  White hawthorn, and the pastoral eglantine;\n    Fast fading violets cover'd up in leaves;\n        And mid-May's eldest child,\n  The coming musk-rose, full of dewy wine,\n    The murmurous haunt of flies on summer eves.\n\nDarkling I listen; and, for many a time\n  I have been half in love with easeful Death,\nCall'd him soft names in many a mused rhyme,\n  To take into the air my quiet breath;\nNow more than ever seems it rich to die,\n  To cease upon the midnight with no pain,\n    While thou art pouring forth thy soul abroad\n        In such an ecstasy!\n  Still wouldst thou sing, and I have ears in vain—\n    To thy high requiem become a sod.\n\nThou wast not born for death, immortal Bird!\n  No hungry generations tread thee down;\nThe voice I hear this passing night was heard\n  In ancient days by emperor and clown:\nPerhaps the self-same song that found a path\n  Through the sad heart of Ruth, when, sick for home,\n    She stood in tears amid the alien corn;\n        The same that oft-times hath\n  Charm'd magic casements, opening on the foam\n    Of perilous seas, in faery lands forlorn.\n\nForlorn! the very word is like a bell\n  To toll me back from thee to my sole self!\nAdieu! the fancy cannot cheat so well\n  As she is fam'd to do, deceiving elf.\nAdieu! adieu! thy plaintive anthem fades\n  Past the near meadows, over the still stream,\n    Up the hill-side; and now 'tis buried deep\n        In the next valley-glades:\n  Was it a vision, or a waking dream?\n    Fled is that music:—Do I wake or sleep?","w":"Written in May 1819 in Hampstead; published 1819, and in the 1820 volume.","b":"His friend Charles Brown recalled Keats writing it in the garden after hearing a nightingale. His brother Tom had died of tuberculosis a few months before, and the poem's line about youth growing “spectre-thin” is often linked to that.","r":"The song tempts the poet away from a world of pain, until the word “forlorn” calls him back. He ends unsure whether he is waking or dreaming.","s":"23684"},{"id":"sh_ozy","t":"Ozymandias","a":"shelley","x":"I met a traveller from an antique land\nWho said: Two vast and trunkless legs of stone\nStand in the desert...Near them, on the sand,\nHalf sunk, a shattered visage lies, whose frown,\nAnd wrinkled lip, and sneer of cold command,\nTell that its sculptor well those passions read\nWhich yet survive, stamped on these lifeless things,\nThe hand that mocked them, and the heart that fed:\nAnd on the pedestal these words appear:\n'My name is Ozymandias, king of kings:\nLook on my works, ye Mighty, and despair!'\nNothing beside remains. Round the decay\nOf that colossal wreck, boundless and bare\nThe lone and level sands stretch far away.","w":"Published January 1818.","b":"Shelley wrote it in a friendly competition with his friend Horace Smith, who wrote a sonnet on the same subject. Ozymandias is a Greek name for the Egyptian pharaoh Ramesses II.","r":"The king's boast survives only on a broken statue in an empty desert. The sculptor's art outlasts the tyrant's power.","s":"4800"},{"id":"sh_music","t":"Music, when soft voices die","a":"shelley","x":"Music, when soft voices die,\nVibrates in the memory—\nOdours, when sweet violets sicken,\nLive within the sense they quicken.\n\nRose leaves, when the rose is dead,\nAre heaped for the beloved's bed;\nAnd so thy thoughts, when thou art gone,\nLove itself shall slumber on.","w":"Published 1824, after his death, in the Posthumous Poems edited by Mary Shelley.","b":"Shelley drowned in 1822, aged 29.","r":"Things live on after they end, music in memory, scent in the leaves, and so will love, even when the beloved is gone.","s":"4800"},{"id":"sh_west","t":"Ode to the West Wind","a":"shelley","x":"O wild West Wind, thou breath of Autumn's being,\nThou, from whose unseen presence the leaves dead\nAre driven, like ghosts from an enchanter fleeing,\n\nYellow, and black, and pale, and hectic red,\nPestilence-stricken multitudes: O thou,\nWho chariotest to their dark wintry bed\n\nThe winged seeds, where they lie cold and low,\nEach like a corpse within its grave, until\nThine azure sister of the Spring shall blow\n\nHer clarion o'er the dreaming earth, and fill\n(Driving sweet buds like flocks to feed in air)\nWith living hues and odours plain and hill:\n\nWild Spirit, which art moving everywhere;\nDestroyer and preserver; hear, oh, hear!\n\nThou on whose stream, mid the steep sky's commotion,\nLoose clouds like earth's decaying leaves are shed,\nShook from the tangled boughs of Heaven and Ocean,\n\nAngels of rain and lightning: there are spread\nOn the blue surface of thine aery surge,\nLike the bright hair uplifted from the head\n\nOf some fierce Maenad, even from the dim verge\nOf the horizon to the zenith's height,\nThe locks of the approaching storm. Thou dirge\n\nOf the dying year, to which this closing night\nWill be the dome of a vast sepulchre,\nVaulted with all thy congregated might\n\nOf vapours, from whose solid atmosphere\nBlack rain, and fire, and hail will burst: oh, hear!\n\nThou who didst waken from his summer dreams\nThe blue Mediterranean, where he lay,\nLulled by the coil of his crystalline streams,\n\nBeside a pumice isle in Baiae's bay,\nAnd saw in sleep old palaces and towers\nQuivering within the wave's intenser day,\n\nAll overgrown with azure moss and flowers\nSo sweet, the sense faints picturing them! Thou\nFor whose path the Atlantic's level powers\n\nCleave themselves into chasms, while far below\nThe sea-blooms and the oozy woods which wear\nThe sapless foliage of the ocean, know\n\nThy voice, and suddenly grow gray with fear,\nAnd tremble and despoil themselves: oh, hear!\n\nIf I were a dead leaf thou mightest bear;\nIf I were a swift cloud to fly with thee;\nA wave to pant beneath thy power, and share\n\nThe impulse of thy strength, only less free\nThan thou, O uncontrollable! If even\nI were as in my boyhood, and could be\n\nThe comrade of thy wanderings over Heaven,\nAs then, when to outstrip thy skiey speed\nScarce seemed a vision; I would ne'er have striven\n\nAs thus with thee in prayer in my sore need.\nOh, lift me as a wave, a leaf, a cloud!\nI fall upon the thorns of life! I bleed!\n\nA heavy weight of hours has chained and bowed\nOne too like thee: tameless, and swift, and proud.\n\nMake me thy lyre, even as the forest is:\nWhat if my leaves are falling like its own!\nThe tumult of thy mighty harmonies\n\nWill take from both a deep, autumnal tone,\nSweet though in sadness. Be thou, Spirit fierce,\nMy spirit! Be thou me, impetuous one!\n\nDrive my dead thoughts over the universe\nLike withered leaves to quicken a new birth!\nAnd, by the incantation of this verse,\n\nScatter, as from an unextinguished hearth\nAshes and sparks, my words among mankind!\nBe through my lips to unawakened earth\n\nThe trumpet of a prophecy! O, Wind,\nIf Winter comes, can Spring be far behind?","w":"Written in October 1819 near Florence; published 1820.","b":"Written in terza rima, the linked rhyme of Dante, arranged in five fourteen-line sections.","r":"The poet asks the wind to scatter his words like leaves and seeds, ending with one of the most hopeful lines in poetry.","s":"4800"},{"id":"c_kubla","t":"Kubla Khan","a":"coleridge","x":"In Xanadu did Kubla Khan\nA stately pleasure-dome decree:\nWhere Alph, the sacred river, ran\nThrough caverns measureless to man\n  Down to a sunless sea.\nSo twice five miles of fertile ground\nWith walls and towers were girdled round:\nAnd here were gardens bright with sinuous rills,\nWhere blossomed many an incense-bearing tree;\nAnd here were forests ancient as the hills,\nEnfolding sunny spots of greenery.\n\nBut oh! that deep romantic chasm which slanted\nDown the green hill athwart a cedarn cover!\n  A savage place! as holy and enchanted\n  As e'er beneath a waning moon was haunted\n  By woman wailing for her demon-lover!\n  And from this chasm, with ceaseless turmoil seething,\n  As if this earth in fast thick pants were breathing,\n  A mighty fountain momently was forced:\n  Amid whose swift half-intermitted burst\n  Huge fragments vaulted like rebounding hail,\n  Or chaffy grain beneath the thresher's flail:\n  And 'mid these dancing rocks at once and ever\n  It flung up momently the sacred river.\n  Five miles meandering with a mazy motion\n  Through wood and dale the sacred river ran,\n  Then reached the caverns measureless to man,\n  And sank in tumult to a lifeless ocean:\n  And 'mid this tumult Kubla heard from far\n  Ancestral voices prophesying war!\n\n  The shadow of the dome of pleasure\n  Floated midway on the waves;\n  Where was heard the mingled measure\n  From the fountain and the caves.\nIt was a miracle of rare device,\nA sunny pleasure-dome with caves of ice!\n\n  A damsel with a dulcimer\n  In a vision once I saw:\n  It was an Abyssinian maid;\n  And on her dulcimer she played,\n  Singing of Mount Abora.\n  Could I revive within me\n  Her symphony and song,\n  To such a deep delight 'twould win me,\nThat with music loud and long,\nI would build that dome in air,\nThat sunny dome! those caves of ice!\nAnd all who heard should see them there,\nAnd all should cry, Beware! Beware!\nHis flashing eyes, his floating hair!\nWeave a circle round him thrice,\nAnd close your eyes with holy dread,\nFor he on honey-dew hath fed,\nAnd drunk the milk of Paradise.","w":"Written in 1797; published 1816.","b":"Coleridge said it came to him in an opium dream and that he was writing it down when “a person on business from Porlock” interrupted him, so he lost the rest.","r":"A dream of a pleasure-dome and a sacred river, and of a poet so inspired that onlookers should fear him.","s":"8208"},{"id":"c_frost","t":"Frost at Midnight","a":"coleridge","x":"The Frost performs its secret ministry,\nUnhelped by any wind. The owlet's cry\nCame loud—and hark, again! loud as before.\nThe inmates of my cottage, all at rest,\nHave left me to that solitude, which suits\nAbstruser musings: save that at my side\nMy cradled infant slumbers peacefully.\n'Tis calm indeed! so calm, that it disturbs\nAnd vexes meditation with its strange\nAnd extreme silentness. Sea, hill, and wood,\nThis populous village! Sea, and hill, and wood,\nWith all the numberless goings-on of life,\nInaudible as dreams! the thin blue flame\nLies on my low-burnt fire, and quivers not;\nOnly that film, which fluttered on the grate,\nStill flutters there, the sole unquiet thing.\nMethinks, its motion in this hush of nature\nGives it dim sympathies with me who live,\nMaking it a companionable form,\nWhose puny flaps and freaks the idling Spirit\nBy its own moods interprets, every where\nEcho or mirror seeking of itself,\nAnd makes a toy of Thought.\n\n                            But O! how oft,\nHow oft, at school, with most believing mind,\nPresageful, have I gazed upon the bars,\nTo watch that fluttering stranger! and as oft\nWith unclosed lids, already had I dreamt\nOf my sweet birth-place, and the old church-tower,\nWhose bells, the poor man's only music, rang\nFrom morn to evening, all the hot Fair-day,\nSo sweetly, that they stirred and haunted me\nWith a wild pleasure, falling on mine ear\nMost like articulate sounds of things to come!\nSo gazed I, till the soothing things, I dreamt,\nLulled me to sleep, and sleep prolonged my dreams!\nAnd so I brooded all the following morn,\nAwed by the stern preceptor's face, mine eye\nFixed with mock study on my swimming book:\nSave if the door half opened, and I snatched\nA hasty glance, and still my heart leaped up,\nFor still I hoped to see the stranger's face,\nTownsman, or aunt, or sister more beloved,\nMy play-mate when we both were clothed alike!\n\n  Dear Babe, that sleepest cradled by my side,\nWhose gentle breathings, heard in this deep calm,\nFill up the interspersed vacancies\nAnd momentary pauses of the thought!\nMy babe so beautiful! it thrills my heart\nWith tender gladness, thus to look at thee,\nAnd think that thou shalt learn far other lore,\nAnd in far other scenes! For I was reared\nIn the great city, pent 'mid cloisters dim,\nAnd saw nought lovely but the sky and stars.\nBut thou, my babe! shalt wander like a breeze\nBy lakes and sandy shores, beneath the crags\nOf ancient mountain, and beneath the clouds,\nWhich image in their bulk both lakes and shores\nAnd mountain crags: so shalt thou see and hear\nThe lovely shapes and sounds intelligible\nOf that eternal language, which thy God\nUtters, who from eternity doth teach\nHimself in all, and all things in himself.\nGreat universal Teacher! he shall mould\nThy spirit, and by giving make it ask.\n\nTherefore all seasons shall be sweet to thee,\nWhether the summer clothe the general earth\nWith greenness, or the redbreast sit and sing\nBetwixt the tufts of snow on the bare branch\nOf mossy apple-tree, while the nigh thatch\nSmokes in the sun-thaw; whether the eave-drops fall\nHeard only in the trances of the blast,\nOr if the secret ministry of frost\nShall hang them up in silent icicles,\nQuietly shining to the quiet Moon.","w":"Written in February 1798; published 1798.","b":"Coleridge wrote it at his cottage in Nether Stowey while his baby son Hartley slept beside him.","r":"A father remembers his own lonely city childhood and promises his son a life raised among lakes and mountains.","s":"8208"},{"id":"bu_rose","t":"A Red, Red Rose","a":"burns","x":"O my Luve's like a red, red rose,\nThat's newly sprung in June:\nO my Luve's like the melodie,\nThat's sweetly play'd in tune.\n\nAs fair art thou, my bonie lass,\nSo deep in luve am I;\nAnd I will luve thee still, my dear,\nTill a' the seas gang dry.\n\nTill a' the seas gang dry, my dear,\nAnd the rocks melt wi' the sun;\nAnd I will luve thee still, my dear,\nWhile the sands o' life shall run.\n\nAnd fare-thee-weel, my only Luve!\nAnd fare-thee-weel, a while!\nAnd I will come again, my Luve,\nTho' 'twere ten thousand mile!","w":"Mid-1790s.","b":"Burns spent his last years collecting and rewriting traditional Scottish songs, and this one reshapes lines from older folk songs.","r":"Love as fresh as a June rose and as lasting as the seas running dry. Its simplicity is the point.","s":"1279"},{"id":"bu_mouse","t":"To a Mouse","a":"burns","x":"Wee, sleekit, cow'rin, tim'rous beastie,\nO, what a panic's in thy breastie!\nThou need na start awa sae hasty,\nWi' bickering brattle!\nI wad be laith to rin an' chase thee,\nWi' murd'ring pattle!\n\nI'm truly sorry man's dominion,\nHas broken nature's social union,\nAn' justifies that ill opinion,\nWhich makes thee startle\nAt me, thy poor, earth-born companion,\nAn' fellow-mortal!\n\nI doubt na, whiles, but thou may thieve;\nWhat then? poor beastie, thou maun live!\nA daimen icker in a thrave\n'S a sma' request;\nI'll get a blessin wi' the lave,\nAn' never miss't!\n\nThy wee bit housie, too, in ruin!\nIt's silly wa's the win's are strewin!\nAn' naething, now, to big a new ane,\nO' foggage green!\nAn' bleak December's winds ensuin,\nBaith snell an' keen!\n\nThou saw the fields laid bare an' waste,\nAn' weary winter comin fast,\nAn' cozie here, beneath the blast,\nThou thought to dwell—\nTill crash! the cruel coulter past\nOut thro' thy cell.\n\nThat wee bit heap o' leaves an' stibble,\nHas cost thee mony a weary nibble!\nNow thou's turn'd out, for a' thy trouble,\nBut house or hald,\nTo thole the winter's sleety dribble,\nAn' cranreuch cauld!\n\nBut, Mousie, thou art no thy lane,\nIn proving foresight may be vain;\nThe best-laid schemes o' mice an 'men\nGang aft agley,\nAn'lea'e us nought but grief an' pain,\nFor promis'd joy!\n\nStill thou art blest, compar'd wi' me\nThe present only toucheth thee:\nBut, Och! I backward cast my e'e.\nOn prospects drear!\nAn' forward, tho' I canna see,\nI guess an' fear!","w":"Written in November 1785; published 1786 in his first book.","b":"Burns was a working farmer; the poem addresses a mouse whose nest his plough has destroyed.","r":"The source of “the best laid schemes o' mice an' men gang aft agley.” The mouse only feels the present, while the poet has to dread the future too.","s":"1279"},{"id":"t_ulysses","t":"Ulysses","a":"tennyson","x":"It little profits that an idle king,\nBy this still hearth, among these barren crags,\nMatch'd with an aged wife, I mete and dole\nUnequal laws unto a savage race,\nThat hoard, and sleep, and feed, and know not me.\nI cannot rest from travel: I will drink\nLife to the lees: all times I have enjoy'd\nGreatly, have suffer'd greatly, both with those\nThat loved me, and alone; on shore, and when\nThro' scudding drifts the rainy Hyades\nVext the dim sea: I am become a name;\nFor always roaming with a hungry heart\nMuch have I seen and known; cities of men\nAnd manners, climates, councils, governments,\nMyself not least, but honour'd of them all;\nAnd drunk delight of battle with my peers,\nFar on the ringing plains of windy Troy.\nI am a part of all that I have met;\nYet all experience is an arch wherethro'\nGleams that untravell'd world, whose margin fades\nFor ever and for ever when I move.\nHow dull it is to pause, to make an end,\nTo rust unburnish'd, not to shine in use!\nAs tho' to breathe were life. Life piled on life\nWere all too little, and of one to me\nLittle remains: but every hour is saved\nFrom that eternal silence, something more,\nA bringer of new things; and vile it were\nFor some three suns to store and hoard myself,\nAnd this gray spirit yearning in desire\nTo follow knowledge, like a sinking star,\nBeyond the utmost bound of human thought.\n\nThis is my son, mine own Telemachus,\nTo whom I leave the sceptre and the isle—\nWell-loved of me, discerning to fulfil\nThis labour, by slow prudence to make mild\nA rugged people, and thro' soft degrees\nSubdue them to the useful and the good.\nMost blameless is he, centred in the sphere\nOf common duties, decent not to fail\nIn offices of tenderness, and pay\nMeet adoration to my household gods,\nWhen I am gone. He works his work, I mine.\nThere lies the port: the vessel puffs her sail:\nThere gloom the dark broad seas. My mariners,\nSouls that have toil'd and wrought, and thought with me—\nThat ever with a frolic welcome took\nThe thunder and the sunshine, and opposed\nFree hearts, free foreheads—you and I are old;\nOld age hath yet his honour and his toil;\nDeath closes all; but something ere the end,\nSome work of noble note, may yet be done,\nNot unbecoming men that strove with Gods.\nThe lights begin to twinkle from the rocks:\nThe long day wanes: the slow moon climbs: the deep\nMoans round with many voices. Come, my friends,\n'Tis not too late to seek a newer world.\nPush off, and sitting well in order smite\nThe sounding furrows; for my purpose holds\nTo sail beyond the sunset, and the baths\nOf all the western stars, until I die.\nIt may be that the gulfs will wash us down:\nIt may be we shall touch the Happy Isles,\nAnd see the great Achilles, whom we knew.\nTho' much is taken, much abides; and tho'\nWe are not now that strength which in old days\nMoved earth and heaven; that which we are, we are;\nOne equal temper of heroic hearts,\nMade weak by time and fate, but strong in will\nTo strive, to seek, to find, and not to yield.","w":"Written in 1833; published 1842.","b":"Tennyson wrote it shortly after the sudden death of his closest friend, Arthur Hallam, and said it expressed the need to go forward and brave the struggle of life.","r":"An old hero refuses to rust at home and sets out again with his old companions: “to strive, to seek, to find, and not to yield.”","s":"8601"},{"id":"t_break","t":"Break, Break, Break","a":"tennyson","x":"Break, break, break,\nOn thy cold gray stones, O Sea!\nAnd I would that my tongue could utter\nThe thoughts that arise in me.\n\nO well for the fisherman's boy,\nThat he shouts with his sister at play!\nO well for the sailor lad,\nThat he sings in his boat on the bay!\n\nAnd the stately ships go on\nTo their haven under the hill;\nBut O for the touch of a vanish'd hand,\nAnd the sound of a voice that is still!\n\nBreak, break, break,\nAt the foot of thy crags, O Sea!\nBut the tender grace of a day that is dead\nWill never come back to me.","w":"Published 1842.","b":"Also connected with Hallam's death; the editor's note in this edition says it was composed in a Lincolnshire lane early one spring morning.","r":"Life carries on around the grieving speaker, children playing and ships sailing home, but nothing can bring back “the touch of a vanish'd hand.”","s":"8601"},{"id":"t_kraken","t":"The Kraken","a":"tennyson","x":"Below the thunders of the upper deep;\nFar, far beneath in the abysmal sea,\nHis antient, dreamless, uninvaded sleep\nThe Kraken sleepeth: faintest sunlights flee\nAbout his shadowy sides: above him swell\nHuge sponges of millennial growth and height;\nAnd far away into the sickly light,\nFrom many a wondrous grot and secret cell\nUnnumber'd and enormous polypi\nWinnow with giant arms the slumbering green.\nThere hath he lain for ages and will lie\nBattening upon huge seaworms in his sleep,\nUntil the latter fire shall heat the deep;\nThen once by man and angels to be seen,\nIn roaring he shall rise and on the surface die.","w":"Published 1830, in his first major collection.","b":"An unusual fifteen-line sonnet, written when Tennyson was about twenty.","r":"A sea-monster sleeping since the beginning of time will rise only at the end of the world, to be seen once and die.","s":"8601"},{"id":"ebb_43","t":"How do I love thee? (Sonnet 43)","a":"ebb","x":"How do I love thee? Let me count the ways.\nI love thee to the depth and breadth and height\nMy soul can reach, when feeling out of sight\nFor the ends of Being and ideal Grace.\nI love thee to the level of everyday’s\nMost quiet need, by sun and candlelight.\nI love thee freely, as men strive for Right;\nI love thee purely, as they turn from Praise.\nI love thee with the passion put to use\nIn my old griefs, and with my childhood’s faith.\nI love thee with a love I seemed to lose\nWith my lost saints,—I love thee with the breath,\nSmiles, tears, of all my life!—and, if God choose,\nI shall but love thee better after death.","w":"Written 1845–46; published 1850.","b":"The sequence records her courtship with Robert Browning. The title disguised how personal the poems were: “my little Portuguese” was Robert's pet name for her.","r":"She counts the ways and finds they are all infinite, ending with love that continues after death.","s":"2002"},{"id":"rb_duchess","t":"My Last Duchess","a":"rbrowning","x":"That's my last Duchess painted on the wall,\nLooking as if she were alive. I call\nThat piece a wonder, now: Frà Pandolf's hands\nWorked busily a day, and there she stands.\nWill't please you sit and look at her? I said\n\"Frà Pandolf\" by design: for never read\nStrangers like you that pictured countenance,\nThe depth and passion of its earnest glance,\nBut to myself they turned (since none puts by\nThe curtain I have drawn for you, but I)\nAnd seemed as they would ask me, if they durst,\nHow such a glance came there; so, not the first\nAre you to turn and ask thus. Sir, 'twas not\nHer husband's presence only, called that spot\nOf joy into the Duchess' cheek: perhaps\nFrà Pandolf chanced to say \"Her mantle laps\nOver my lady's wrist too much,\" or \"Paint\nMust never hope to reproduce the faint\nHalf-flush that dies along her throat:\" such stuff\nWas courtesy, she thought, and cause enough\nFor calling up that spot of joy. She had\nA heart—how shall I say?—too soon made glad,\nToo easily impressed; she liked whate'er\nShe looked on, and her looks went everywhere.\nSir, 'twas all one! My favour at her breast,\nThe dropping of the daylight in the West,\nThe bough of cherries some officious fool\nBroke in the orchard for her, the white mule\nShe rode with round the terrace—all and each\nWould draw from her alike the approving speech,\nOr blush, at least. She thanked men,—good! but thanked\nSomehow—I know not how—as if she ranked\nMy gift of a nine-hundred-years-old name\nWith anybody's gift. Who'd stoop to blame\nThis sort of trifling? Even had you skill\nIn speech—(which I have not)—to make your will\nQuite clear to such an one, and say, \"Just this\nOr that in you disgusts me; here you miss,\nOr there exceed the mark\"—and if she let\nHerself be lessoned so, nor plainly set\nHer wits to yours, forsooth, and made excuse,\n—E'en then would be some stooping: and I choose\nNever to stoop. Oh, sir, she smiled, no doubt,\nWhene'er I passed her; but who passed without\nMuch the same smile? This grew; I gave commands;\nThen all smiles stopped together. There she stands\nAs if alive. Will't please you rise? We'll meet\nThe company below, then. I repeat,\nThe Count your master's known munificence\nIs ample warrant that no just pretence\nOf mine for dowry will be disallowed;\nThough his fair daughter's self, as I avowed\nAt starting, is my object. Nay, we'll go\nTogether down, sir. Notice Neptune, though,\nTaming a sea-horse, thought a rarity,\nWhich Claus of Innsbruck cast in bronze for me!","w":"Published 1842.","b":"A dramatic monologue: we hear only the speaker, usually identified with a 16th-century Duke of Ferrara, showing a visitor his late wife's portrait.","r":"Without ever saying so outright, the Duke reveals that he had his wife silenced because she smiled at everyone. Then he moves on to arranging his next marriage.","s":"16376"},{"id":"rb_home","t":"Home-Thoughts, from Abroad","a":"rbrowning","x":"Oh, to be in England\nNow that April's there,\nAnd whoever wakes in England\nSees, some morning, unaware,\nThat the lowest boughs and the brushwood sheaf\nRound the elm-tree bole are in tiny leaf,\nWhile the chaffinch sings on the orchard bough\nIn England—now!\n\nAnd after April, when May follows,\nAnd the white-throat builds, and all the swallows!\nHark I where my blossomed pear tree in the hedge\nLeans to the field and scatters on the clover\nBlossoms and dewdrops—at the bent spray's edge—\nThat's the wise thrush; he sings each song twice over,\nLest you should think he never could recapture\nThe first fine careless rapture!\nAnd though the fields look rough with hoary dew,\nAll will be gay when noontide wakes anew\nThe buttercups, the little children's dower\n—Far brighter than this gaudy melon-flower!","w":"Published 1845.","b":"Browning spent much of his life in Italy.","r":"Homesickness for an English April: the wise thrush sings its song twice, so you won't think it can't recapture its first fine careless rapture.","s":"16376"},{"id":"cr_remember","t":"Remember","a":"rossetti","x":"Remember me when I am gone away,\n  Gone far away into the silent land;\n  When you can no more hold me by the hand,\nNor I half turn to go yet turning stay.\nRemember me when no more day by day\n  You tell me of our future that you planned:\n  Only remember me; you understand\nIt will be late to counsel then or pray.\nYet if you should forget me for a while\n  And afterwards remember, do not grieve:\n  For if the darkness and corruption leave\n  A vestige of the thoughts that once I had,\nBetter by far you should forget and smile\n  Than that you should remember and be sad.","w":"Written in 1849; published 1862.","b":"Written when Rossetti was about eighteen, and shaped as a sonnet.","r":"She asks to be remembered, then changes her mind: better to be forgotten than for the beloved to be sad.","s":"16950"},{"id":"cr_uphill","t":"Up-Hill","a":"rossetti","x":"Does the road wind up-hill all the way?\n  Yes, to the very end.\nWill the day's journey take the whole long day?\n  From morn to night, my friend.\n\nBut is there for the night a resting-place?\n  A roof for when the slow dark hours begin.\nMay not the darkness hide it from my face?\n  You cannot miss that inn.\n\nShall I meet other wayfarers at night?\n  Those who have gone before.\nThen must I knock, or call when just in sight?\n  They will not keep you standing at that door.\n\nShall I find comfort, travel-sore and weak?\n  Of labour you shall find the sum.\nWill there be beds for me and all who seek?\n  Yea, beds for all who come.","w":"First published 1861 in Macmillan's Magazine; collected 1862.","b":"Rossetti was a devout Anglican, and much of her poetry is religious.","r":"Life is a long road to an inn, and the answers to each anxious question are calm and certain: there is room for everyone.","s":"16950"},{"id":"cr_birthday","t":"A Birthday","a":"rossetti","x":"My heart is like a singing bird\n  Whose nest is in a watered shoot;\nMy heart is like an apple-tree\n  Whose boughs are bent with thickset fruit;\nMy heart is like a rainbow shell\n  That paddles in a halcyon sea;\nMy heart is gladder than all these\n  Because my love is come to me.\n\nRaise me a dais of silk and down;\n  Hang it with vair and purple dyes;\nCarve it in doves, and pomegranates,\n  And peacocks with a hundred eyes;\nWork it in gold and silver grapes,\n  In leaves, and silver fleurs-de-lys;\nBecause the birthday of my life\n  Is come, my love is come to me.","w":"Written in 1857; published 1862.","b":"An unusually joyful poem from a poet better known for sorrow and renunciation.","r":"Her heart is a singing bird because “my love is come to me.” The second stanza heaps up gorgeous decorations to celebrate.","s":"16950"},{"id":"cr_song","t":"Song (When I am dead, my dearest)","a":"rossetti","x":"When I am dead, my dearest,\n  Sing no sad songs for me;\nPlant thou no roses at my head,\n  Nor shady cypress tree:\nBe the green grass above me\n  With showers and dewdrops wet;\nAnd if thou wilt, remember,\n  And if thou wilt, forget.\n\nI shall not see the shadows,\n  I shall not feel the rain;\nI shall not hear the nightingale\n  Sing on, as if in pain:\nAnd dreaming through the twilight\n  That doth not rise nor set,\nHaply I may remember,\n  And haply may forget.","w":"Written in 1848; published 1862.","b":"Written when she was about eighteen.","r":"Don't mourn me with sad songs: she may remember, or she may forget. The calm indifference is both comforting and unsettling.","s":"16950"},{"id":"h_pied","t":"Pied Beauty","a":"hopkins","x":"Glory be to God for dappled things—\n   For skies of couple-colour as a brinded cow;\n      For rose-moles all in stipple upon trout that swim:\nFresh-firecoal chestnut-falls; finches' wings;\n   Landscape plotted and pieced—fold, fallow, and\n      plough;\n     And àll tràdes, their gear and tackle and trim.\n\nAll things counter, original, spare, strange;\n   Whatever is fickle, freckled (who knows how?)\n      With swift, slow; sweet, sour; adazzle, dim;\nHe fathers-forth whose beauty is past change:\n                  Praise him.","w":"Written in 1877; first published 1918.","b":"Hopkins was a Jesuit priest. Almost none of his poems were published in his lifetime; his friend Robert Bridges collected them nearly thirty years after his death.","r":"A hymn of praise for everything dappled, spotted and strange, all fathered by a God “whose beauty is past change.”","s":"22403"},{"id":"h_grandeur","t":"God's Grandeur","a":"hopkins","x":"The world is charged with the grandeur of God.\n   It will flame out, like shining from shook foil;\n   It gathers to a greatness, like the ooze of oil\nCrushed. Why do men then now not reck his rod?\nGenerations have trod, have trod, have trod;\n   And all is seared with trade; bleared, smeared with toil;\n   And wears man's smudge and shares man's smell: the soil\nIs bare now, nor can foot feel, being shod.\n\nAnd for all this, nature is never spent;\n   There lives the dearest freshness deep down things;\nAnd though the last lights off the black West went\n   Oh, morning, at the brown brink eastward, springs—\nBecause the Holy Ghost over the bent\n   World broods with warm breast and with ah! bright wings.","w":"Written in 1877; first published 1918.","b":"Written while Hopkins was studying theology in north Wales.","r":"Humanity has smeared the world with trade and toil, yet nature is never spent: freshness lives “deep down things.”","s":"22403"},{"id":"h_spring","t":"Spring and Fall","a":"hopkins","x":"Márgarét, áre you gríeving\nOver Goldengrove unleaving?\nLeáves, like the things of man, you\nWith your fresh thoughts care for, can you?\nÁh! ás the heart grows older\nIt will come to such sights colder\nBy and by, nor spare a sigh\nThough worlds of wanwood leafmeal lie;\nAnd yet you wíll weep and know why.\nNow no matter, child, the name:\nSórrow's spríngs áre the same.\nNor mouth had, no nor mind, expressed\nWhat heart heard of, ghost guessed:\nIt is the blight man was born for,\nIt is Margaret you mourn for.","w":"Written in 1880; first published 1918.","b":"Subtitled “to a young child”; the accents mark Hopkins's own emphasis for reading aloud.","r":"A child cries over falling leaves without knowing why. The speaker tells her gently that she is really mourning for herself.","s":"22403"},{"id":"h_inversnaid","t":"Inversnaid","a":"hopkins","x":"This darksome burn, horseback brown,\nHis rollrock highroad roaring down,\nIn coop and in comb the fleece of his foam\nFlutes and low to the lake falls home.\n\nA windpuff-bonnet of fáawn-fróth\nTurns and twindles over the broth\nOf a pool so pitchblack, féll-frówning,\nIt rounds and rounds Despair to drowning.\n\nDegged with dew, dappled with dew\nAre the groins of the braes that the brook treads through,\nWiry heathpacks, flitches of fern,\nAnd the beadbonny ash that sits over the burn.\n\nWhat would the world be, once bereft\nOf wet and of wildness? Let them be left,\nO let them be left, wildness and wet;\nLong live the weeds and the wilderness yet.","w":"Written in 1881; first published 1918.","b":"Inspired by a visit to a waterfall at Inversnaid, beside Loch Lomond.","r":"A rushing Highland stream, and a plea: let the wet and the wildness be left alone.","s":"22403"},{"id":"hd_thrush","t":"The Darkling Thrush","a":"hardy","x":"I Leant upon a coppice gate\n   When Frost was spectre-gray,\nAnd Winter’s dregs made desolate\n   The weakening eye of day.\nThe tangled bine-stems scored the sky\n   Like strings from broken lyres,\nAnd all mankind that haunted nigh\n   Had sought their household fires.\n\nThe land’s sharp features seemed to be\n   The Century’s corpse outleant,\nHis crypt the cloudy canopy,\n   The wind his death-lament.\nThe ancient pulse of germ and birth\n   Was shrunken hard and dry,\nAnd every spirit upon earth\n   Seemed fervourless as I.\n\nAt once a voice outburst among\n   The bleak twigs overhead\nIn a full-hearted evensong\n   Of joy illimited;\nAn aged thrush, frail, gaunt, and small,\n   In blast-beruffled plume,\nHad chosen thus to fling his soul\n   Upon the growing gloom.\n\nSo little cause for carollings\n   Of such ecstatic sound\nWas written on terrestrial things\n   Afar or nigh around,\nThat I could think there trembled through\n   His happy good-night air\nSome blessed Hope, whereof he knew\n   And I was unaware.","w":"Published 29 December 1900; collected 1901.","b":"Written for the end of the 19th century and first titled “By the Century's Deathbed”.","r":"In a bleak winter landscape an old thrush sings with joy. The poet can see no reason for it, but wonders whether the bird knows of some hope he doesn't.","s":"3168"},{"id":"hd_neutral","t":"Neutral Tones","a":"hardy","x":"We stood by a pond that winter day,\nAnd the sun was white, as though chidden of God,\nAnd a few leaves lay on the starving sod,\n   —They had fallen from an ash, and were gray.\n\nYour eyes on me were as eyes that rove\nOver tedious riddles solved years ago;\nAnd some words played between us to and fro—\n   On which lost the more by our love.\n\nThe smile on your mouth was the deadest thing\nAlive enough to have strength to die;\nAnd a grin of bitterness swept thereby\n   Like an ominous bird a-wing . . .\n\nSince then, keen lessons that love deceives,\nAnd wrings with wrong, have shaped to me\nYour face, and the God-curst sun, and a tree,\n   And a pond edged with grayish leaves.","w":"Written in 1867; published 1898.","b":"Hardy published his first poems only after giving up novel-writing in the 1890s, though he had been writing verse for decades.","r":"A colourless winter memory of the end of a love affair, which becomes the lens through which he sees every later betrayal.","s":"3167"},{"id":"hd_hap","t":"Hap","a":"hardy","x":"If but some vengeful god would call to me\nFrom up the sky, and laugh: “Thou suffering thing,\nKnow that thy sorrow is my ecstasy,\nThat thy love’s loss is my hate’s profiting!”\n\nThen would I bear, and clench myself, and die,\nSteeled by the sense of ire unmerited;\nHalf-eased in that a Powerfuller than I\nHad willed and meted me the tears I shed.\n\nBut not so. How arrives it joy lies slain,\nAnd why unblooms the best hope ever sown?\n—Crass Casualty obstructs the sun and rain,\nAnd dicing Time for gladness casts a moan . . .\nThese purblind Doomsters had as readily strown\nBlisses about my pilgrimage as pain.","w":"Written in 1866; published 1898.","b":"“Hap” means chance.","r":"It would almost be easier if a cruel god were punishing him. Instead his suffering is just random luck, “purblind Doomsters.”","s":"3167"},{"id":"hd_channel","t":"Channel Firing","a":"hardy","x":"That night your great guns, unawares,\nShook all our coffins as we lay,\nAnd broke the chancel window-squares,\nWe thought it was the Judgment-day\n\nAnd sat upright. While drearisome\nArose the howl of wakened hounds:\nThe mouse let fall the altar-crumb,\nThe worms drew back into the mounds,\n\nThe glebe cow drooled. Till God called, “No;\nIt’s gunnery practice out at sea\nJust as before you went below;\nThe world is as it used to be:\n\n“All nations striving strong to make\nRed war yet redder. Mad as hatters\nThey do no more for Christés sake\nThan you who are helpless in such matters.\n\n“That this is not the judgment-hour\nFor some of them’s a blessed thing,\nFor if it were they’d have to scour\nHell’s floor for so much threatening . . .\n\n“Ha, ha. It will be warmer when\nI blow the trumpet (if indeed\nI ever do; for you are men,\nAnd rest eternal sorely need).”\n\nSo down we lay again. “I wonder,\nWill the world ever saner be,”\nSaid one, “than when He sent us under\nIn our indifferent century!”\n\nAnd many a skeleton shook his head.\n“Instead of preaching forty year,”\nMy neighbour Parson Thirdly said,\n“I wish I had stuck to pipes and beer.”\n\nAgain the guns disturbed the hour,\nRoaring their readiness to avenge,\nAs far inland as Stourton Tower,\nAnd Camelot, and starlit Stonehenge.","w":"Written in April 1914; collected later that year.","b":"Written months before the First World War began, during naval gunnery practice in the English Channel.","r":"The guns wake the dead, who think it's Judgement Day. God tells them the world is still as mad as ever.","s":"2863"},{"id":"hd_oxen","t":"The Oxen","a":"hardy","x":"Christmas Eve, and twelve of the clock.\n   “Now they are all on their knees,”\nAn elder said as we sat in a flock\n   By the embers in hearthside ease.\n\nWe pictured the meek mild creatures where\n   They dwelt in their strawy pen,\nNor did it occur to one of us there\n   To doubt they were kneeling then.\n\nSo fair a fancy few would weave\n   In these years! Yet, I feel,\nIf someone said on Christmas Eve,\n   “Come; see the oxen kneel\n\n“In the lonely barton by yonder coomb\n   Our childhood used to know,”\nI should go with him in the gloom,\n   Hoping it might be so.","w":"Published 24 December 1915, during the First World War.","b":"It recalls a country belief that cattle kneel at midnight on Christmas Eve.","r":"He no longer believes, but if someone asked him to go and look, he would go, “hoping it might be so.”","s":"3255"},{"id":"ho_loveliest","t":"Loveliest of trees, the cherry now (II)","a":"housman","x":"Loveliest of trees, the cherry now\nIs hung with bloom along the bough,\nAnd stands about the woodland ride\nWearing white for Eastertide.\n\nNow, of my threescore years and ten,\nTwenty will not come again,\nAnd take from seventy springs a score,\nIt only leaves me fifty more.\n\nAnd since to look at things in bloom\nFifty springs are little room,\nAbout the woodlands I will go\nTo see the cherry hung with snow.","w":"A Shropshire Lad, 1896.","b":"Housman, a classical scholar, published the book at his own expense; it became one of the best-loved books of English verse.","r":"At twenty he calculates he has only fifty springs left, too few to waste, so he goes out to see the cherry blossom.","s":"5720"},{"id":"ho_21","t":"When I was one-and-twenty (XIII)","a":"housman","x":"When I was one-and-twenty\n I heard a wise man say,\n\"Give crowns and pounds and guineas\n But not your heart away;\nGive pearls away and rubies\n But keep your fancy free.\"\nBut I was one-and-twenty,\n No use to talk to me.\n\nWhen I was one-and-twenty\n I heard him say again,\n\"The heart out of the bosom\n Was never given in vain;\n'Tis paid with sighs a plenty\n And sold for endless rue.\"\nAnd I am two-and-twenty,\n And oh, 'tis true, 'tis true.","w":"A Shropshire Lad, 1896.","b":"Many of the book's poems are spoken by young men from the Shropshire countryside.","r":"A wise man's advice ignored at twenty-one, and painfully proven true by twenty-two.","s":"5720"},{"id":"ho_athlete","t":"To an Athlete Dying Young (XIX)","a":"housman","x":"The time you won your town the race\nWe chaired you through the market-place;\nMan and boy stood cheering by,\nAnd home we brought you shoulder-high.\n\nTo-day, the road all runners come,\nShoulder-high we bring you home,\nAnd set you at your threshold down,\nTownsman of a stiller town.\n\nSmart lad, to slip betimes away\nFrom fields where glory does not stay\nAnd early though the laurel grows\nIt withers quicker than the rose.\n\nEyes the shady night has shut\nCannot see the record cut,\nAnd silence sounds no worse than cheers\nAfter earth has stopped the ears:\n\nNow you will not swell the rout\nOf lads that wore their honours out,\nRunners whom renown outran\nAnd the name died before the man.\n\nSo set, before its echoes fade,\nThe fleet foot on the sill of shade,\nAnd hold to the low lintel up\nThe still-defended challenge-cup.\n\nAnd round that early-laurelled head\nWill flock to gaze the strengthless dead,\nAnd find unwithered on its curls\nThe garland briefer than a girl's.","w":"A Shropshire Lad, 1896.","b":"An elegy for a young runner carried home through the town that once cheered him.","r":"There is consolation in dying at your peak: he will never watch his records broken or his fame fade.","s":"5720"},{"id":"ho_blue","t":"Into my heart an air that kills (XL)","a":"housman","x":"Into my heart an air that kills\n From yon far country blows:\nWhat are those blue remembered hills,\n What spires, what farms are those?\n\nThat is the land of lost content,\n I see it shining plain,\nThe happy highways where I went\n And cannot come again.","w":"A Shropshire Lad, 1896.","b":"Eight lines about a lost countryside of youth.","r":"“That is the land of lost content”: the happy highways where he went and cannot come again.","s":"5720"},{"id":"y_innis","t":"The Lake Isle of Innisfree","a":"yeats","x":"I Will arise and go now, and go to Innisfree,\nAnd a small cabin build there, of clay and wattles made;\nNine bean rows will I have there, a hive for the honey bee,\nAnd live alone in the bee-loud glade.\n\nAnd I shall have some peace there, for peace comes dropping slow,\nDropping from the veils of the morning to where the cricket sings;\nThere midnight’s all a glimmer, and noon a purple glow,\nAnd evening full of the linnet’s wings.\n\nI will arise and go now, for always night and day\nI hear lake water lapping with low sounds by the shore;\nWhile I stand on the roadway, or on the pavements gray,\nI hear it in the deep heart’s core.","w":"Written in 1888; published 1890.","b":"Yeats wrote it while homesick in London; he later said the sound of water from a fountain in a shop window brought back memories of the lake. Innisfree is an island in Lough Gill, County Sligo.","r":"Standing on grey city pavements, he hears the lake water lapping “in the deep heart's core.”","s":"49608"},{"id":"y_old","t":"When You Are Old","a":"yeats","x":"When you are old and gray and full of sleep,\nAnd nodding by the fire, take down this book,\nAnd slowly read, and dream of the soft look\nYour eyes had once, and of their shadows deep;\n\nHow many loved your moments of glad grace,\nAnd loved your beauty with love false or true;\nBut one man loved the pilgrim soul in you,\nAnd loved the sorrows of your changing face.\n\nAnd bending down beside the glowing bars\nMurmur, a little sadly, how love fled\nAnd paced upon the mountains overhead\nAnd hid his face amid a crowd of stars.","w":"Published 1892.","b":"Written for Maud Gonne, the actress and Irish nationalist he loved for years without success. It is loosely based on a sonnet by the French poet Ronsard.","r":"Imagining her old and reading this book, he reminds her that one man loved “the pilgrim soul” in her, not just her beauty.","s":"49608"},{"id":"y_salley","t":"Down by the Salley Gardens","a":"yeats","x":"Down by the salley gardens my love and I did meet;\nShe passed the salley gardens with little snow-white feet.\nShe bid me take love easy, as the leaves grow on the tree;\nBut I, being young and foolish, with her would not agree.\n\nIn a field by the river my love and I did stand,\nAnd on my leaning shoulder she laid her snow-white hand.\nShe bid me take life easy, as the grass grows on the weirs;\nBut I was young and foolish, and now am full of tears.","w":"Published 1889.","b":"Yeats said it was his attempt to reconstruct an old song from a few lines an elderly woman in County Sligo half remembered. Salley means willow.","r":"Simple, songlike regret: she told him to take love and life easy, but he was young and foolish.","s":"49608"},{"id":"y_aengus","t":"The Song of Wandering Aengus","a":"yeats","x":"I Went out to the hazel wood,\nBecause a fire was in my head,\nAnd cut and peeled a hazel wand,\nAnd hooked a berry to a thread;\nAnd when white moths were on the wing,\nAnd moth-like stars were flickering out,\nI dropped the berry in a stream\nAnd caught a little silver trout.\n\nWhen I had laid it on the floor\nI went to blow the fire a-flame,\nBut something rustled on the floor,\nAnd someone called me by my name:\nIt had become a glimmering girl\nWith apple blossom in her hair\nWho called me by my name and ran\nAnd faded through the brightening air.\n\nThough I am old with wandering\nThrough hollow lands and hilly lands,\nI will find out where she has gone,\nAnd kiss her lips and take her hands;\nAnd walk among long dappled grass,\nAnd pluck till time and times are done\nThe silver apples of the moon,\nThe golden apples of the sun.","w":"Published 1897; collected 1899.","b":"Aengus is the Irish god of love and youth.","r":"A trout turns into a glimmering girl who calls his name and vanishes; he will spend his life searching for her.","s":"49608"},{"id":"y_cloths","t":"He Wishes for the Cloths of Heaven","a":"yeats","x":"Had I the heavens’ embroidered cloths,\nEnwrought with golden and silver light,\nThe blue and the dim and the dark cloths\nOf night and light and the half light,\nI would spread the cloths under your feet:\nBut I, being poor, have only my dreams;\nI have spread my dreams under your feet;\nTread softly because you tread on my dreams.","w":"The Wind Among the Reeds, 1899.","b":"Only eight lines long, and one of his most quoted poems.","r":"If he had the heavens' embroidered cloths he would spread them under her feet, but being poor, he has only his dreams. “Tread softly.”","s":"49608"},{"id":"wh_captain","t":"O Captain! My Captain!","a":"whitman","x":"O Captain! my Captain! our fearful trip is done,\nThe ship has weather'd every rack, the prize we sought is won,\nThe port is near, the bells I hear, the people all exulting,\nWhile follow eyes the steady keel, the vessel grim and daring;\n    But O heart! heart! heart!\n     O the bleeding drops of red,\n       Where on the deck my Captain lies,\n         Fallen cold and dead.\n\nO Captain! my Captain! rise up and hear the bells;\nRise up—for you the flag is flung—for you the bugle trills,\nFor you bouquets and ribbon'd wreaths—for you the shores a-crowding,\nFor you they call, the swaying mass, their eager faces turning;\n    Here Captain! dear father!\n     This arm beneath your head!\n       It is some dream that on the deck,\n         You've fallen cold and dead.\n\nMy Captain does not answer, his lips are pale and still,\nMy father does not feel my arm, he has no pulse nor will,\nThe ship is anchor'd safe and sound, its voyage closed and done,\nFrom fearful trip the victor ship comes in with object won;\n     Exult O shores, and ring O bells!\n       But I with mournful tread,\n         Walk the deck my Captain lies,\n           Fallen cold and dead.","w":"Written in 1865; published that year.","b":"An elegy for Abraham Lincoln, assassinated as the Civil War ended. It is one of the very few Whitman poems with regular rhyme and metre.","r":"The ship of state has come safely home, but its captain lies dead on the deck.","s":"1322"},{"id":"wh_astro","t":"When I Heard the Learn'd Astronomer","a":"whitman","x":"When I heard the learn'd astronomer,\nWhen the proofs, the figures, were ranged in columns before me,\nWhen I was shown the charts and diagrams, to add, divide, and measure them,\nWhen I sitting heard the astronomer where he lectured with much\n    applause in the lecture-room,\nHow soon unaccountable I became tired and sick,\nTill rising and gliding out I wander'd off by myself,\nIn the mystical moist night-air, and from time to time,\nLook'd up in perfect silence at the stars.","w":"Published 1865.","b":"This text is from the final, 1891–92 edition of Leaves of Grass, which Whitman expanded and revised all his life.","r":"Charts and proofs leave him tired; he slips outside and looks up at the stars in silence.","s":"1322"},{"id":"wh_spider","t":"A Noiseless Patient Spider","a":"whitman","x":"A noiseless patient spider,\nI mark'd where on a little promontory it stood isolated,\nMark'd how to explore the vacant vast surrounding,\nIt launch'd forth filament, filament, filament out of itself,\nEver unreeling them, ever tirelessly speeding them.\n\nAnd you O my soul where you stand,\nSurrounded, detached, in measureless oceans of space,\nCeaselessly musing, venturing, throwing, seeking the spheres to\n    connect them,\nTill the bridge you will need be form'd, till the ductile anchor hold,\nTill the gossamer thread you fling catch somewhere, O my soul.","w":"First published 1868.","b":"An earlier draft was a love poem; this version turns the image toward the soul.","r":"The spider casts thread after thread into empty space; so does the soul, hoping a line will catch somewhere.","s":"1322"},{"id":"wh_singing","t":"I Hear America Singing","a":"whitman","x":"I hear America singing, the varied carols I hear,\nThose of mechanics, each one singing his as it should be blithe and strong,\nThe carpenter singing his as he measures his plank or beam,\nThe mason singing his as he makes ready for work, or leaves off work,\nThe boatman singing what belongs to him in his boat, the deckhand\n    singing on the steamboat deck,\nThe shoemaker singing as he sits on his bench, the hatter singing as\n    he stands,\nThe wood-cutter's song, the ploughboy's on his way in the morning,\n    or at noon intermission or at sundown,\nThe delicious singing of the mother, or of the young wife at work,\n    or of the girl sewing or washing,\nEach singing what belongs to him or her and to none else,\nThe day what belongs to the day—at night the party of young\n    fellows, robust, friendly,\nSinging with open mouths their strong melodious songs.","w":"First appeared in the 1860 edition of Leaves of Grass.","b":"Whitman's ideal of a democratic America lies in its ordinary working people.","r":"Each worker sings what belongs to them alone: carpenter, boatman, mother, girl sewing. Together they make the nation's song.","s":"1322"},{"id":"wh_ome","t":"O Me! O Life!","a":"whitman","x":"O me! O life! of the questions of these recurring,\nOf the endless trains of the faithless, of cities fill'd with the foolish,\nOf myself forever reproaching myself, (for who more foolish than I,\n    and who more faithless?)\nOf eyes that vainly crave the light, of the objects mean, of the\n    struggle ever renew'd,\nOf the poor results of all, of the plodding and sordid crowds I see\n    around me,\nOf the empty and useless years of the rest, with the rest me intertwined,\nThe question, O me! so sad, recurring—What good amid these, O me, O life?\n\n     Answer.\nThat you are here—that life exists and identity,\nThat the powerful play goes on, and you may contribute a verse.","w":"First appeared in the 1867 edition of Leaves of Grass.","b":"Its closing lines were famously quoted in the 1989 film Dead Poets Society.","r":"What good is anything amid endless foolishness? The answer: that you are here, and you may contribute a verse.","s":"1322"},{"id":"po_annabel","t":"Annabel Lee","a":"poe","x":"It was many and many a year ago,\n    In a kingdom by the sea,\nThat a maiden lived whom you may know\n    By the name of ANNABEL LEE;—\nAnd this maiden she lived with no other thought\n    Than to love and be loved by me.\n\nI was a child and She was a child,\n    In this kingdom by the sea,\nBut we loved with a love that was more than love—\n    I and my ANNABEL LEE—\nWith a love that the wingéd seraphs of Heaven\n    Coveted her and me.\n\nAnd this was the reason that, long ago,\n    In this kingdom by the sea,\nA wind blew out of a cloud by night\n    Chilling my ANNABEL LEE;\nSo that her high-born kinsmen came\n    And bore her away from me,\nTo shut her up, in a sepulchre\n    In this kingdom by the sea.\n\nThe angels, not half so happy in Heaven,\n    Went envying her and me;\nYes! that was the reason (as all men know,\n    In this kingdom by the sea)\nThat the wind came out of the cloud, chilling\n    And killing my ANNABEL LEE.\n\nBut our love it was stronger by far than the love\n    Of those who were older than we—\n    Of many far wiser than we—\nAnd neither the angels in Heaven above\n    Nor the demons down under the sea\nCan ever dissever my soul from the soul\n    Of the beautiful ANNABEL LEE:—\n\nFor the moon never beams without bringing me dreams\n    Of the beautiful ANNABEL LEE;\nAnd the stars never rise but I see the bright eyes\n    Of the beautiful ANNABEL LEE;\nAnd so, all the night-tide, I lie down by the side\nOf my darling, my darling, my life and my bride\n    In her sepulchre there by the sea—\n    In her tomb by the side of the sea.","w":"Written in 1849; published days after Poe's death in October 1849.","b":"His last complete poem, often linked with his young wife Virginia, who died in 1847. Versions differ in the last line: some read “by the sounding sea”; this edition has “side of the sea”.","r":"A love so great the angels envied it, and a grief that makes him lie down beside her tomb every night.","s":"2151"},{"id":"po_dream","t":"A Dream Within a Dream","a":"poe","x":"Take this kiss upon the brow!\nAnd, in parting from you now,\nThus much let me avow—\nYou are not wrong, who deem\nThat my days have been a dream;\nYet if hope has flown away\nIn a night, or in a day,\nIn a vision, or in none,\nIs it therefore the less gone?\nAll that we see or seem\nIs but a dream within a dream.\n\nI stand amid the roar\nOf a surf-tormented shore,\nAnd I hold within my hand\nGrains of the golden sand—\nHow few! yet how they creep\nThrough my fingers to the deep,\nWhile I weep—while I weep!\nO God! can I not grasp\nThem with a tighter clasp?\nO God! can I not save\nOne from the pitiless wave?\nIs all that we see or seem\nBut a dream within a dream?","w":"Published 1849; it grew out of a much earlier poem of his from 1827.","b":"Written in the last year of Poe's life.","r":"Sand slipping through his fingers: can he not hold on to even one grain? Is everything just a dream within a dream? (The source edition has a stray full stop after the final question mark, which has been removed.)","s":"2151"},{"id":"po_alone","t":"Alone","a":"poe","x":"From childhood’s hour I have not been\nAs others were—I have not seen\nAs others saw—I could not bring\nMy passions from a common spring—\nFrom the same source I have not taken\nMy sorrow—I could not awaken\nMy heart to joy at the same tone—\nAnd all I lov’d—I lov’d alone—\nThen—in my childhood—in the dawn\nOf a most stormy life—was drawn\nFrom ev’ry depth of good and ill\nThe mystery which binds me still—\nFrom the torrent, or the fountain—\nFrom the red cliff of the mountain—\nFrom the sun that ‘round me roll’d\nIn its autumn tint of gold—\nFrom the lightning in the sky\nAs it pass’d me flying by—\nFrom the thunder, and the storm—\nAnd the cloud that took the form\n(When the rest of Heaven was blue)\nOf a demon in my view—","w":"Written in 1829; first published 1875, long after his death.","b":"Poe was about twenty when he wrote it.","r":"From childhood he saw differently from others; even a summer cloud took the shape of a demon to his eyes.","s":"2151"},{"id":"lf_tide","t":"The Tide Rises, the Tide Falls","a":"longfellow","x":"The tide rises, the tide falls,\nThe twilight darkens, the curlew calls;\nAlong the sea-sands damp and brown\nThe traveller hastens toward the town,\n   And the tide rises, the tide falls.\n\nDarkness settles on roofs and walls,\nBut the sea in the darkness calls and calls;\nThe little waves, with their soft, white hands,\nEfface the footprints in the sands,\n  And the tide rises, the tide falls.\n\nThe morning breaks; the steeds in their stalls\nStamp and neigh, as the hostler calls;\nThe day returns, but nevermore\nReturns the traveller to the shore,\n   And the tide rises, the tide falls.","w":"Written in 1879; published 1880.","b":"One of his last poems; Longfellow was the most popular American poet of his century.","r":"A traveller vanishes and the sea erases his footprints, but the tide goes on rising and falling, indifferent.","s":"1365"},{"id":"lf_arrow","t":"The Arrow and the Song","a":"longfellow","x":"I shot an arrow into the air,\nIt fell to earth, I knew not where;\nFor, so swiftly it flew, the sight\nCould not follow it in its flight.\n\nI breathed a song into the air,\nIt fell to earth, I knew not where;\nFor who has sight so keen and strong,\nThat it can follow the flight of song?\n\nLong, long afterward, in an oak\nI found the arrow, still unbroke;\nAnd the song, from beginning to end,\nI found again in the heart of a friend.","w":"Published in the mid-1840s.","b":"A short poem in the plain, musical style that made Longfellow widely loved.","r":"Things sent out into the world seem lost, until you find them again, the song whole, in the heart of a friend.","s":"1365"},{"id":"du_mask","t":"We Wear the Mask","a":"dunbar","x":"We wear the mask that grins and lies,\nIt hides our cheeks and shades our eyes,—\nThis debt we pay to human guile;\nWith torn and bleeding hearts we smile,\nAnd mouth with myriad subtleties.\n\nWhy should the world be over-wise,\nIn counting all our tears and sighs?\nNay, let them only see us, while\n    We wear the mask.\n\nWe smile, but, O great Christ, our cries\nTo thee from tortured souls arise.\nWe sing, but oh the clay is vile\nBeneath our feet, and long the mile;\nBut let the world dream otherwise,\n    We wear the mask!","w":"Published 1895; collected 1896.","b":"Dunbar was born in Dayton, Ohio, to parents who had been enslaved, and became one of the first nationally famous African American poets.","r":"Behind smiles worn for the world lies hidden pain. The mask is a defence the world never thinks to look past.","s":"18338"},{"id":"du_sympathy","t":"Sympathy","a":"dunbar","x":"I know what the caged bird feels, alas!\n  When the sun is bright on the upland slopes;\nWhen the wind stirs soft through the springing grass,\nAnd the river flows like a stream of glass;\n  When the first bird sings and the first bud opes,\nAnd the faint perfume from its chalice steals—\nI know what the caged bird feels!\n\nI know why the caged bird beats his wing\n  Till its blood is red on the cruel bars;\nFor he must fly back to his perch and cling\nWhen he fain would be on the bough a-swing;\n  And a pain still throbs in the old, old scars\nAnd they pulse again with a keener sting—\nI know why he beats his wing!\n\nI know why the caged bird sings, ah me,\n  When his wing is bruised and his bosom sore,—\nWhen he beats his bars and he would be free;\nIt is not a carol of joy or glee,\n  But a prayer that he sends from his heart's deep core,\nBut a plea, that upward to Heaven he flings—\nI know why the caged bird sings!","w":"Published 1899.","b":"Maya Angelou took the title of her 1969 memoir, I Know Why the Caged Bird Sings, from its last line.","r":"The caged bird's song isn't joy but a prayer sent up from the heart, a plea for freedom.","s":"18338"},{"id":"fr_road","t":"The Road Not Taken","a":"frost","x":"Two roads diverged in a yellow wood,\nAnd sorry I could not travel both\nAnd be one traveler, long I stood\nAnd looked down one as far as I could\nTo where it bent in the undergrowth;\n\nThen took the other, as just as fair,\nAnd having perhaps the better claim,\nBecause it was grassy and wanted wear;\nThough as for that the passing there\nHad worn them really about the same,\n\nAnd both that morning equally lay\nIn leaves no step had trodden black.\nOh, I kept the first for another day!\nYet knowing how way leads on to way,\nI doubted if I should ever come back.\n\nI shall be telling this with a sigh\nSomewhere ages and ages hence:\nTwo roads diverged in a wood, and I—\nI took the one less traveled by,\nAnd that has made all the difference.","w":"First published 1915; collected 1916.","b":"Frost said it was partly a gentle joke about his friend the poet Edward Thomas, who on their walks always wondered about the path they hadn't chosen. Thomas was killed in the war two years later.","r":"Usually read as a celebration of choosing the unusual path, but the speaker admits the roads were really about the same. The “difference” may be a story told afterwards.","s":"29345"},{"id":"fr_birches","t":"Birches","a":"frost","x":"When I see birches bend to left and right\nAcross the lines of straighter darker trees,\nI like to think some boy's been swinging them.\nBut swinging doesn't bend them down to stay.\nIce-storms do that. Often you must have seen them\nLoaded with ice a sunny winter morning\nAfter a rain. They click upon themselves\nAs the breeze rises, and turn many-colored\nAs the stir cracks and crazes their enamel.\nSoon the sun's warmth makes them shed crystal shells\nShattering and avalanching on the snow-crust—\nSuch heaps of broken glass to sweep away\nYou'd think the inner dome of heaven had fallen.\nThey are dragged to the withered bracken by the load,\nAnd they seem not to break; though once they are bowed\nSo low for long, they never right themselves:\nYou may see their trunks arching in the woods\nYears afterwards, trailing their leaves on the ground\nLike girls on hands and knees that throw their hair\nBefore them over their heads to dry in the sun.\nBut I was going to say when Truth broke in\nWith all her matter-of-fact about the ice-storm\n(Now am I free to be poetical?)\nI should prefer to have some boy bend them\nAs he went out and in to fetch the cows—\nSome boy too far from town to learn baseball,\nWhose only play was what he found himself,\nSummer or winter, and could play alone.\nOne by one he subdued his father's trees\nBy riding them down over and over again\nUntil he took the stiffness out of them,\nAnd not one but hung limp, not one was left\nFor him to conquer. He learned all there was\nTo learn about not launching out too soon\nAnd so not carrying the tree away\nClear to the ground. He always kept his poise\nTo the top branches, climbing carefully\nWith the same pains you use to fill a cup\nUp to the brim, and even above the brim.\nThen he flung outward, feet first, with a swish,\nKicking his way down through the air to the ground.\nSo was I once myself a swinger of birches.\nAnd so I dream of going back to be.\nIt's when I'm weary of considerations,\nAnd life is too much like a pathless wood\nWhere your face burns and tickles with the cobwebs\nBroken across it, and one eye is weeping\nFrom a twig's having lashed across it open.\nI'd like to get away from earth awhile\nAnd then come back to it and begin over.\nMay no fate willfully misunderstand me\nAnd half grant what I wish and snatch me away\nNot to return. Earth's the right place for love:\nI don't know where it's likely to go better.\nI'd like to go by climbing a birch tree,\nAnd climb black branches up a snow-white trunk\nToward heaven, till the tree could bear no more,\nBut dipped its top and set me down again.\nThat would be good both going and coming back.\nOne could do worse than be a swinger of birches.","w":"First published 1915; collected 1916.","b":"Written while Frost was living in England, remembering New England.","r":"A boy swinging on birches becomes an image for escaping earth for a while and coming back. “Earth's the right place for love.”","s":"29345"},{"id":"fr_oven","t":"The Oven Bird","a":"frost","x":"There is a singer everyone has heard,\nLoud, a mid-summer and a mid-wood bird,\nWho makes the solid tree trunks sound again.\nHe says that leaves are old and that for flowers\nMid-summer is to spring as one to ten.\nHe says the early petal-fall is past\nWhen pear and cherry bloom went down in showers\nOn sunny days a moment overcast;\nAnd comes that other fall we name the fall.\nHe says the highway dust is over all.\nThe bird would cease and be as other birds\nBut that he knows in singing not to sing.\nThe question that he frames in all but words\nIs what to make of a diminished thing.","w":"Mountain Interval, 1916.","b":"A loose sonnet about a North American bird that sings loudly in midsummer, after most birds have stopped.","r":"The bird's question is the poem's: “what to make of a diminished thing.”","s":"29345"},{"id":"fr_out","t":"“Out, Out—”","a":"frost","x":"The buzz-saw snarled and rattled in the yard\nAnd made dust and dropped stove-length sticks of wood,\nSweet-scented stuff when the breeze drew across it.\nAnd from there those that lifted eyes could count\nFive mountain ranges one behind the other\nUnder the sunset far into Vermont.\nAnd the saw snarled and rattled, snarled and rattled,\nAs it ran light, or had to bear a load.\nAnd nothing happened: day was all but done.\nCall it a day, I wish they might have said\nTo please the boy by giving him the half hour\nThat a boy counts so much when saved from work.\nHis sister stood beside them in her apron\nTo tell them \"Supper.\" At the word, the saw,\nAs if to prove saws knew what supper meant,\nLeaped out at the boy's hand, or seemed to leap—\nHe must have given the hand. However it was,\nNeither refused the meeting. But the hand!\nThe boy's first outcry was a rueful laugh,\nAs he swung toward them holding up the hand\nHalf in appeal, but half as if to keep\nThe life from spilling. Then the boy saw all—\nSince he was old enough to know, big boy\nDoing a man's work, though a child at heart—\nHe saw all spoiled. \"Don't let him cut my hand off—\nThe doctor, when he comes. Don't let him, sister!\"\nSo. But the hand was gone already.\nThe doctor put him in the dark of ether.\nHe lay and puffed his lips out with his breath.\nAnd then—the watcher at his pulse took fright.\nNo one believed. They listened at his heart.\nLittle—less—nothing!—and that ended it.\nNo more to build on there. And they, since they\nWere not the one dead, turned to their affairs.","w":"Published 1916.","b":"The title echoes Macbeth's “Out, out, brief candle!” Frost drew on the death of a local boy in a sawmill accident in 1910.","r":"The boy's life ends in a few lines, and the people around him, “since they were not the one dead,” go back to their affairs.","s":"29345"},{"id":"fr_wall","t":"Mending Wall","a":"frost","x":"Something there is that doesn't love a wall,\nThat sends the frozen-ground-swell under it,\nAnd spills the upper boulders in the sun;\nAnd makes gaps even two can pass abreast.\nThe work of hunters is another thing:\nI have come after them and made repair\nWhere they have left not one stone on a stone,\nBut they would have the rabbit out of hiding,\nTo please the yelping dogs. The gaps I mean,\nNo one has seen them made or heard them made,\nBut at spring mending-time we find them there.\nI let my neighbour know beyond the hill;\nAnd on a day we meet to walk the line\nAnd set the wall between us once again.\nWe keep the wall between us as we go.\nTo each the boulders that have fallen to each.\nAnd some are loaves and some so nearly balls\nWe have to use a spell to make them balance:\n\"Stay where you are until our backs are turned!\"\nWe wear our fingers rough with handling them.\nOh, just another kind of out-door game,\nOne on a side. It comes to little more:\nThere where it is we do not need the wall:\nHe is all pine and I am apple orchard.\nMy apple trees will never get across\nAnd eat the cones under his pines, I tell him.\nHe only says, \"Good fences make good neighbours.\"\nSpring is the mischief in me, and I wonder\nIf I could put a notion in his head:\n\"Why do they make good neighbours? Isn't it\nWhere there are cows? But here there are no cows.\nBefore I built a wall I'd ask to know\nWhat I was walling in or walling out,\nAnd to whom I was like to give offence.\nSomething there is that doesn't love a wall,\nThat wants it down.\" I could say \"Elves\" to him,\nBut it's not elves exactly, and I'd rather\nHe said it for himself. I see him there\nBringing a stone grasped firmly by the top\nIn each hand, like an old-stone savage armed.\nHe moves in darkness as it seems to me,\nNot of woods only and the shade of trees.\nHe will not go behind his father's saying,\nAnd he likes having thought of it so well\nHe says again, \"Good fences make good neighbours.\"","w":"North of Boston, 1914, first published in London.","b":"Frost was living in England when his first books appeared and made his name.","r":"The neighbour repeats his father's saying, “Good fences make good neighbors.” The speaker doubts it, yet he is the one who arranges the mending each spring.","s":"3026"},{"id":"fr_pasture","t":"The Pasture","a":"frost","x":"I'm going out to clean the pasture spring;\nI'll only stop to rake the leaves away\n(And wait to watch the water clear, I may):\nI sha'n't be gone long.—You come too.\nI'm going out to fetch the little calf\nThat's standing by the mother. It's so young,\nIt totters when she licks it with her tongue.\nI sha'n't be gone long.—You come too.","w":"North of Boston, 1914.","b":"Frost used it to open his boo
