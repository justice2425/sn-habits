<title>Habits</title>
<style>
  :root {
    --bg:        var(--sn-stylekit-background-color, #ffffff);
    --fg:        var(--sn-stylekit-foreground-color, #1f2328);
    --panel:     var(--sn-stylekit-contrast-background-color, #f4f6f8);
    --panel-2:   var(--sn-stylekit-secondary-background-color, #ffffff);
    --border:    var(--sn-stylekit-border-color, #d8dce0);
    --muted:     var(--sn-stylekit-passive-color-1, #6b7177);
    --muted-2:   var(--sn-stylekit-passive-color-2, #9aa0a6);
    --accent:    var(--sn-stylekit-info-color, #2f6fed);
    --accent-fg: var(--sn-stylekit-info-contrast-color, #ffffff);
    --danger:    var(--sn-stylekit-danger-color, #e5484d);
    --success:   var(--sn-stylekit-success-color, #30a46c);
    --warning:   var(--sn-stylekit-warning-color, #c47900);
    --radius: 8px;
    --shadow: 0 6px 24px rgba(0,0,0,0.18);
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:14px; line-height:1.4; -webkit-font-smoothing:antialiased; }
  #app { display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  button,input,select,textarea { font-family:inherit; font-size:inherit; color:var(--fg); }
  button { background:transparent; border:1px solid transparent; color:var(--fg); border-radius:6px; padding:5px 10px; cursor:pointer; line-height:1.2; }
  button:hover { background:var(--panel-2); }
  button.primary { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
  button.ghost { border-color:var(--border); }
  button.danger { color:var(--danger); }
  input[type=text],input[type=number],input[type=date],input[type=search],select { background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:6px 8px; outline:none; width:100%; }
  input:focus,select:focus { border-color:var(--accent); }
  ::placeholder { color:var(--muted-2); }

  .toolbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:8px 12px; border-bottom:1px solid var(--border); background:var(--panel); }
  .toolbar .grow { flex:1 1 auto; }
  .seg { display:inline-flex; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
  .seg { flex-wrap:wrap; }
  .seg button { border-radius:0; border:none; padding:5px 10px; }
  .seg button.active { background:var(--accent); color:var(--accent-fg); }
  .subhead { padding:6px 14px 0; color:var(--muted); font-size:13px; }
  .surface { flex:1 1 auto; overflow:auto; padding:14px; }

  /* Today */
  .todayview { max-width:640px; margin:0 auto; }
  .hrow { display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--border); }
  .hrow:first-child { border-top:none; }
  .hicon { font-size:20px; width:24px; text-align:center; flex:0 0 auto; }
  .hname { flex:1 1 auto; }
  .hname .rest { color:var(--muted); font-size:12px; margin-left:6px; }
  .streak { display:inline-flex; align-items:center; gap:3px; font-size:12px; padding:2px 8px; border-radius:999px; background:rgba(196,121,0,.13); color:var(--warning); white-space:nowrap; }
  .check { width:28px; height:28px; border-radius:50%; border:2px solid var(--muted-2); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .check.done { background:var(--success); border-color:var(--success); color:#fff; }
  .check.done::after { content:"✓"; font-size:15px; }
  .counter { display:inline-flex; align-items:center; gap:6px; flex:0 0 auto; }
  .counter .val { min-width:54px; text-align:center; font-size:13px; }
  .counter button { border:1px solid var(--border); width:26px; height:26px; padding:0; border-radius:6px; }
  .pbar { height:6px; border-radius:999px; background:var(--panel); margin:8px 0 0 36px; overflow:hidden; }
  .pbar > span { display:block; height:100%; background:var(--accent); }
  .addhabit { margin-top:14px; }

  /* Today: daily progress ring */
  .todayprog { display:flex; align-items:center; gap:14px; padding:2px 4px 14px; margin-bottom:2px; border-bottom:1px solid var(--border); }
  .tp-ring { flex:0 0 auto; line-height:0; }
  .tp-frac { font-size:22px; font-weight:700; line-height:1.1; }
  .tp-frac span { font-size:15px; color:var(--muted); font-weight:600; }
  .tp-sub { font-size:12px; color:var(--muted); margin-top:2px; }

  /* Today: 7-day momentum strip */
  .mstrip { display:flex; gap:4px; margin:8px 0 14px 36px; }
  .mdot { width:13px; height:13px; border-radius:3px; background:var(--panel); border:1px solid var(--border); }
  .mdot.on { border-color:transparent; }
  .mdot.off { opacity:.3; }
  .mdot.skip { background:repeating-linear-gradient(45deg,var(--panel),var(--panel) 2px,var(--border) 2px,var(--border) 3px); }
  .mdot.today { outline:1px solid var(--accent); outline-offset:1px; }
  .hmain { display:flex; align-items:center; gap:12px; flex:1 1 auto; min-width:0; cursor:pointer; border-radius:6px; margin:-4px; padding:4px; }
  .hmain:hover { background:var(--panel-2); }
  .hrow.done .hname { color:var(--muted); }
  /* big, bright check-off button */
  .bigcheck { flex:0 0 auto; width:34px; height:34px; padding:0; border-radius:50%; border:2.5px solid var(--muted-2);
    background:transparent; cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
    transition:transform .12s ease, background .12s ease, border-color .12s ease; }
  .bigcheck:hover { transform:scale(1.1); }
  .bigcheck:active { transform:scale(.9); }
  .bigcheck.done { color:#fff; animation:pop .22s ease; }
  .bigcheck.done::after { content:"✓"; font-size:19px; font-weight:800; line-height:1; }
  @keyframes pop { 0%{ transform:scale(.6); } 55%{ transform:scale(1.18); } 100%{ transform:scale(1); } }

  /* Calendar: zoom toggle */
  .calzoom { display:inline-flex; border:1px solid var(--border); border-radius:6px; overflow:hidden; margin-bottom:14px; }
  .calzoom-btn { border:none; border-radius:0; padding:5px 12px; }
  .calzoom-btn.on { background:var(--accent); color:var(--accent-fg); }

  /* Grid */
  .grid-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .gridv { display:grid; gap:4px; align-items:center; width:max-content; }
  .gridv .gdow { text-align:center; font-size:10px; color:var(--muted-2); }
  .gridv .glabel { white-space:nowrap; padding-right:8px; font-size:13px; position:sticky; left:0; background:var(--bg); z-index:1; }
  .cell { width:18px; height:18px; border-radius:4px; background:var(--panel); border:1px solid var(--border); display:block; cursor:pointer; }
  .cell.done { border-color:transparent; }
  .cell.today { outline:2px solid var(--accent); outline-offset:-2px; }
  .cell.off { opacity:.35; cursor:default; }

  /* Stats */
  .stat-cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px; }
  .scard { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:12px 14px; }
  .scard h4 { margin:0 0 8px; font-size:14px; display:flex; align-items:center; gap:8px; }
  .smetrics { display:flex; gap:14px; flex-wrap:wrap; }
  .smetric .n { font-size:20px; font-weight:700; }
  .smetric .l { font-size:11px; color:var(--muted); }
  .wk { display:flex; gap:3px; margin-top:8px; }
  .wk span { width:14px; height:14px; border-radius:3px; background:var(--panel-2); border:1px solid var(--border); }
  .wk span.on { background:var(--success); border-color:var(--success); }

  /* Modal */
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:flex-start; justify-content:center; z-index:50; overflow:auto; padding:40px 16px; }
  .overlay.open { display:flex; }
  .modal { background:var(--bg); border:1px solid var(--border); border-radius:12px; width:100%; max-width:480px; box-shadow:var(--shadow); }
  .modal-head { display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--border); }
  .modal-body { padding:14px; display:flex; flex-direction:column; gap:12px; }
  .modal-foot { display:flex; justify-content:space-between; padding:12px 14px; border-top:1px solid var(--border); }
  .field label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; font-weight:600; }
  .field-row { display:flex; gap:10px; }
  .field-row > .field { flex:1; }
  .dows { display:flex; gap:5px; flex-wrap:wrap; }
  .dow-btn { border:1px solid var(--border); border-radius:6px; padding:5px 9px; cursor:pointer; }
  .dow-btn.on { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
  .iconpick { display:flex; gap:6px; flex-wrap:wrap; }
  .iconpick button { font-size:18px; border:1px solid var(--border); width:36px; height:34px; padding:0; }
  .iconpick button.on { border-color:var(--accent); background:var(--panel); }
  .swatches { display:flex; gap:6px; flex-wrap:wrap; }
  .swatches button { width:26px; height:26px; border-radius:50%; border:2px solid transparent; padding:0; }
  .swatches button.on { border-color:var(--fg); }
  .small { font-size:12px; color:var(--muted); }
  .empty { color:var(--muted); text-align:center; padding:40px 12px; }
  .iconbtn { padding:4px 6px; color:var(--muted); }
  .iconbtn:hover { color:var(--fg); }
  .streak.risk { background:rgba(229,72,77,.13); color:var(--danger); }
  .riskbanner { background:rgba(196,121,0,.13); color:var(--warning); border:1px solid var(--warning); border-radius:8px; padding:8px 10px; margin-bottom:12px; font-size:13px; }
  .medal { font-size:12px; color:var(--warning); margin-top:6px; }
  textarea { font-family:inherit; }

  .month-head { display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .month-title { font-weight:600; min-width:150px; }
  .month-head select { width:auto; margin-left:auto; }
  .cal { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; max-width:560px; }
  .cal-dow { text-align:center; font-size:11px; color:var(--muted-2); }
  .cal-cell { position:relative; border:1px solid var(--border); border-radius:6px; padding:4px; min-height:46px; }
  .cal-cell.empty { border:none; }
  .cal-cell.caltoday { outline:2px solid var(--accent); outline-offset:-2px; }
  .cal-cell.sched { border-style:dashed; }
  .cal-num { font-size:11px; color:var(--muted); position:relative; z-index:1; }
  .cal-cell.filled .cal-num { color:#fff; }
  .cal-fill { position:absolute; inset:0; background:var(--success); border-radius:5px; }

  /* Calendar: day-by-day log */
  .dl { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)) minmax(54px,.85fr); gap:5px; max-width:860px; }
  .dl-dow { text-align:center; font-size:11px; color:var(--muted-2); }
  .dl-wkh { text-align:right; padding-right:4px; }
  .dl-cell { position:relative; border:1px solid var(--border); border-radius:8px; padding:4px 5px 8px; min-height:74px; cursor:pointer; display:flex; flex-direction:column; gap:3px; overflow:hidden; background:var(--bg); }
  .dl-cell:hover, .dl-cell:focus-visible { border-color:var(--accent); outline:none; }
  .dl-cell.out { border:none; cursor:default; background:transparent; }
  .dl-cell.fut { cursor:default; opacity:.45; }
  .dl-cell.today { outline:2px solid var(--accent); outline-offset:-2px; }
  .dl-cell.sched { border-style:dashed; }
  .dl-cell.filled .dl-num, .dl-cell.filled .dl-wo { color:#fff; }
  .dl-top { display:flex; justify-content:space-between; align-items:flex-start; gap:2px; }
  .dl-num { font-size:12px; color:var(--muted); font-weight:600; }
  .dl-badges { font-size:12px; line-height:1; display:flex; gap:1px; }
  .dl-jn { font-size:10px; }
  .dl-dots { display:flex; flex-wrap:wrap; gap:3px; }
  .dl-dot { width:8px; height:8px; border-radius:50%; }
  .dl-more { font-size:9px; color:var(--muted); }
  .dl-wo { font-size:10.5px; color:var(--fg); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; }
  .dl-prog { position:absolute; left:5px; right:5px; bottom:4px; height:3px; border-radius:999px; background:var(--panel); overflow:hidden; }
  .dl-prog > span { display:block; height:100%; background:var(--accent); }
  .dl-prog > span.all { background:var(--success); }
  .dl-wk { font-size:11px; color:var(--muted); text-align:right; padding:4px 4px 0 0; display:flex; flex-direction:column; gap:1px; font-variant-numeric:tabular-nums; }
  .dl-wkpct { font-weight:700; color:var(--fg); font-size:12px; }
  .dl-legend { max-width:860px; margin-top:10px; }
  @media (max-width:560px){ .dl { gap:3px; grid-template-columns:repeat(7,minmax(0,1fr)) 40px; } .dl-cell { min-height:58px; padding:3px 3px 7px; } .dl-wo { display:none; } .dl-dot { width:6px; height:6px; } .dl-badges { font-size:10px; } .dl-wk { font-size:10px; } }
  /* Day panel */
  .daypanel { max-width:560px; }
  .dp-title { flex:1; text-align:center; }
  .dp-sec { font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-top:4px; }
  .dp-h { display:flex; align-items:center; gap:10px; padding:6px 0; border-top:1px solid var(--border); }
  .dp-h.dim .dp-mid { opacity:.6; }
  .dp-ic { width:22px; text-align:center; font-size:18px; flex:0 0 auto; }
  .dp-mid { flex:1; min-width:0; }
  .dp-name { font-size:14px; }
  .dp-tag { font-size:11px; color:var(--muted); border:1px solid var(--border); border-radius:999px; padding:0 6px; margin-left:6px; }
  .dp-det { font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dp-more { font-size:12px; padding:3px 8px; flex:0 0 auto; }
  .dp-chk { width:30px; height:30px; }
  .dp-j { border-top:1px solid var(--border); padding-top:8px; }
  .dp-jtop { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:12px; color:var(--muted); margin-bottom:4px; }
  .dp-j .jedit { font-size:12px; padding:3px 8px; }
  .dp-write { align-self:flex-start; }
  .spark { display:flex; align-items:flex-end; gap:2px; height:30px; margin-top:8px; }
  .spark span { flex:1; border-radius:2px 2px 0 0; min-height:2px; }
  .cell.skip, .cal-cell.skip, .ycell.skip { background:repeating-linear-gradient(45deg, var(--panel), var(--panel) 3px, var(--border) 3px, var(--border) 4px); }
  .year-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .year { display:grid; grid-template-rows:repeat(7,12px); grid-auto-flow:column; grid-auto-columns:12px; gap:3px; width:max-content; }
  .ycell { width:12px; height:12px; border-radius:2px; background:var(--panel); border:1px solid var(--border); }
  .ymonths { display:flex; gap:3px; margin-bottom:4px; font-size:10px; color:var(--muted-2); }
  .journal .jhead { font-size:16px; font-weight:600; margin-bottom:4px; }
  .journal .jday { margin:14px 0 2px; font-size:12px; color:var(--muted); font-weight:600; }
  .journal { max-width:720px; }
  .journal .jitem { display:flex; gap:10px; padding:10px 0; border-top:1px solid var(--border); }
  .journal .ji-ic { width:20px; text-align:center; flex:0 0 auto; }
  .journal .ji-txt { flex:1; }
  .journal .ji-name { font-size:12px; color:var(--muted); }
  .insights { max-width:640px; }
  .ins-note { font-size:12px; color:var(--muted); margin-bottom:10px; }
  .ins-card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
  .ins-card h4 { margin:0 0 8px; font-size:14px; }
  .ins-card .small { margin:4px 0; }
  .ins-big { font-size:26px; font-weight:700; margin:2px 0; }
  .ins-trend { font-size:13px; font-weight:600; margin-left:6px; }
  .ins-trend.up { color:var(--success); } .ins-trend.down { color:var(--danger); } .ins-trend.steady { color:var(--muted); }
  .ins-row { display:flex; align-items:center; gap:8px; margin:5px 0; }
  .ins-rlbl { width:16px; font-size:12px; color:var(--muted); text-align:center; }
  .ins-hname { width:150px; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ins-bar { flex:1; height:8px; border-radius:999px; background:var(--bg); border:1px solid var(--border); overflow:hidden; }
  .ins-bar > span { display:block; height:100%; background:var(--accent); }
  .ins-rval { width:58px; text-align:right; font-size:12px; color:var(--muted); }
  .ins-weeks { display:flex; gap:8px; align-items:flex-end; }
  .ins-week { flex:1; text-align:center; }
  .ins-vbar { height:70px; display:flex; align-items:flex-end; background:var(--bg); border:1px solid var(--border); border-radius:5px; overflow:hidden; }
  .ins-vbar > span { display:block; width:100%; background:var(--accent); }
  .ins-wlbl { font-size:11px; margin-top:3px; } .ins-wlbl2 { font-size:10px; color:var(--muted); }
  .ins-cloud { display:flex; flex-wrap:wrap; gap:4px 10px; align-items:baseline; margin-top:4px; }
  .ins-word { line-height:1.2; }
  .ins-of { font-size:15px; color:var(--muted); font-weight:600; }
  .ins-sub { margin-top:12px !important; font-weight:600; }
  .ins-rval-w { width:92px; white-space:nowrap; }
  .ins-mood { flex:1; font-size:13px; font-variant-numeric:tabular-nums; }
  .ins-caveat { color:var(--muted-2,var(--muted)); font-style:italic; font-size:11px; }
  .restpill { font-size:12px; color:var(--muted); border:1px solid var(--border); border-radius:999px; padding:3px 10px; cursor:pointer; flex:0 0 auto; }
  .restpill.on { color:var(--accent); border-color:var(--accent); }

  /* ---- Gamification: level bar (Today) ---- */
  .rowmenu { position:fixed; z-index:200; background:var(--bg); border:1px solid var(--border); border-radius:10px; box-shadow:0 6px 24px rgba(0,0,0,.18); padding:6px; min-width:170px; }
  .rowmenu-item { display:block; width:100%; text-align:left; padding:9px 12px; border:none; background:transparent; border-radius:6px; font-size:14px; color:var(--fg); cursor:pointer; }

  .levelbar { display:flex; align-items:center; gap:12px; padding:10px 12px; margin-bottom:14px; position:relative;
    background:var(--panel); border:1px solid var(--border); border-radius:12px; }
  .lv-badge { flex:0 0 auto; width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:16px; color:var(--accent-fg); background:var(--accent);
    box-shadow:0 2px 8px color-mix(in srgb, var(--accent) 40%, transparent); }

  .lv-top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:5px; }

<script>
"use strict";
/* ===========================================================================
   PART 1 — Standard Notes component bridge (vanilla port of the documented
   component-relay protocol). No build step, no dependencies.
   =========================================================================== */
const SNBridge = (function () {
  const Action = {
    StreamContextItem: 'stream-context-item',
    SaveItems: 'save-items',
    ComponentRegistered: 'component-registered',
    ActivateThemes: 'themes',
    ThemesActivated: 'themes-activated',
    SetComponentData: 'set-component-data',
  };
  const API_COMPONENT = 'component';

  let sessionKey = null;
  let environment = null;
  let platform = null;
  let componentData = {};
  let lastItem = null;            // current NoteContainer
  const sentMessages = [];        // awaiting replies (messageId -> callback)
  const queue = [];               // messages sent before registration
  let activeThemes = [];
  let onNote = null;              // callback(noteText, meta)
  let saveTimer = null;
  let saveDelay = 250;
  let standalone = false;         // true when not embedded in SN (test harness / direct open)
  let parentOrigin = null;        // origin of the host that registered us (pinned on first registration)
  let streamedKey = null;         // session key the note stream was requested under
  // https hosts whose theme stylesheets we accept (desktop uses http://localhost; mobile uses data: CSS).
  // Keep in sync with style-src / font-src / img-src in the Content-Security-Policy above.
  const THEME_HOSTS = ['app.standardnotes.com'];

  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });
  }
  function isMobile() { return environment === 'mobile'; }

  function post(action, data, callback) {
    if (!sessionKey || parentOrigin === null) { queue.push({ action, data, callback }); return; }
    const message = { action, data, messageId: uuid(), sessionKey, api: API_COMPONENT };
    // Keep only what reply routing needs. (Storing a full copy of every message, as the
    // reference relay does, retains a copy of the whole note, attachments included, on every save.)
    if (typeof callback === 'function') {
      sentMessages.push({ messageId: message.messageId, callback });
      if (sentMessages.length > 200) {   // drop the oldest one-shot entry; never the stream subscription
        const i = sentMessages.findIndex(m => m.callback !== onStreamed);
        if (i !== -1) sentMessages.splice(i, 1);
      }
    }
    // Send only to the origin that registered us, never '*', so note contents can't be
    // delivered to a different page if the parent frame is navigated or replaced.
    // (Hosts served from file:// or with an opaque origin, which some mobile builds may use,
    // can't be addressed by origin; only in that case do we fall back to '*', as before.)
    const target = /^https?:\/\/[^/]+$/i.test(parentOrigin) ? parentOrigin : '*';
    window.parent.postMessage(isMobile() ? JSON.stringify(message) : message, target);
  }

  const isObj = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);

  function handle(payload) {
    if (!isObj(payload) || typeof payload.action !== 'string') return;
    if (payload.action === Action.ComponentRegistered) {
      if (typeof payload.sessionKey !== 'string' || !payload.sessionKey) return;
      sessionKey = payload.sessionKey;
      if (isObj(payload.componentData)) componentData = payload.componentData;
      const d = isObj(payload.data) ? payload.data : {};
      environment = typeof d.environment === 'string' ? d.environment : null;
      platform = typeof d.platform === 'string' ? d.platform : null;
      standalone = false;
      // flush queue
      const pending = queue.splice(0, queue.length);
      pending.forEach(m => post(m.action, m.data, m.callback));
      activateThemes(Array.isArray(d.activeThemeUrls) ? d.activeThemeUrls : []);
      post(Action.ThemesActivated, {});
      // begin streaming the open note (again only if the host re-registers with a new session)
      if (streamedKey !== sessionKey) {
        streamedKey = sessionKey;
        for (let i = sentMessages.length - 1; i >= 0; i--) if (sentMessages[i].callback === onStreamed) sentMessages.splice(i, 1);
        post(Action.StreamContextItem, {}, onStreamed);
      }
      return;
    }
    if (payload.action === Action.ActivateThemes) {
      activateThemes((isObj(payload.data) && Array.isArray(payload.data.themes)) ? payload.data.themes : []);
      return;
    }
    // reply routing: only replies to messages we actually sent are acted on
    if (!isObj(payload.original) || typeof payload.original.messageId !== 'string') return;
    const idx = sentMessages.findIndex(m => m.messageId === payload.original.messageId);
    if (idx === -1) return;
    const original = sentMessages[idx];
    if (original.callback !== onStreamed) sentMessages.splice(idx, 1);  // one-shot replies
    original.callback(payload.data);
  }

  function onStreamed(data) {
    const item = isObj(data) ? data.item : null;
    if (!isObj(item) || !isObj(item.content)) return;
    if (item.content.text != null && typeof item.content.text !== 'string') return;
    // A save still waiting on its debounce belongs to the previous item: send it now, before
    // switching, so an edit made just before changing notes can't be lost or misfiled.
    if (saveTimer && lastItem && lastItem.uuid !== item.uuid) { clearTimeout(saveTimer); saveTimer = null; flush(); }
    lastItem = item;
    if (item.isMetadataUpdate) return;   // skip pure metadata pings
    if (onNote) onNote(text(), meta());
  }

  function text() {
    return (lastItem && lastItem.content && lastItem.content.text) || '';
  }
  function meta() {
    if (lastItem && lastItem.content) {
      const id = lastItem.content.editorIdentifier;
      const app = lastItem.content.appData || {};
      return (id && app[id]) || {};
    }
    return {};
  }

  function save(newText, previewText) {
    if (standalone) { return; } // nothing to save to when opened directly
    if (!lastItem) return;
    lastItem.content.text = newText;
    if (typeof previewText === 'string') lastItem.content.preview_plain = previewText;
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, saveDelay);
  }
  function flush() {
    if (!lastItem) return;
    const copy = Object.assign({}, lastItem);
    copy.children = null; copy.parent = null;
    post(Action.SaveItems, { items: [copy] });
  }

  // Theme stylesheets are supplied by the host. Accept only the kinds of URL Standard Notes
  // actually sends (its own web app, the desktop app's local server, or a base64 CSS data URL
  // on mobile); the Content-Security-Policy enforces the same list.
  function isAllowedThemeUrl(u) {
    if (typeof u !== 'string' || !u || u.length > 2000000) return false;
    if (/^data:text\/css[;,]/i.test(u)) return true;
    let p; try { p = new URL(u); } catch (e) { return false; }
    if (p.username || p.password) return false;
    if (p.protocol === 'https:' && THEME_HOSTS.includes(p.hostname)) return true;
    if (p.protocol === 'http:' && (p.hostname === 'localhost' || p.hostname === '127.0.0.1')) return true;
    return false;
  }
  function activateThemes(urls) {
    urls = urls.filter(isAllowedThemeUrl).slice(0, 10);
    if (activeThemes.slice().sort().toString() === urls.slice().sort().toString()) return;
    // remove old
    Array.from(document.getElementsByClassName('sn-theme')).forEach(el => el.remove());
    urls.forEach(url => {
      const link = document.createElement('link');
      link.className = 'sn-theme'; link.rel = 'stylesheet'; link.type = 'text/css'; link.href = url;
      document.head.appendChild(link);
    });
    activeThemes = urls;
  }

  function originOf(u) { try { return new URL(u).origin; } catch (e) { return null; } }

  function listen() {
    const onMsg = (event) => {
      // Same checks as the official @standardnotes/component-relay, plus a source check:
      // 1. the sender must be our parent frame (on mobile the source can be null);
      // 2. if we know who embedded us (document.referrer), the sender must be that origin;
      // 3. the first 'component-registered' pins the host origin, and every later message
      //    must come from that same origin.
      if (event.source && event.source !== window.parent) return;
      const origin = typeof event.origin === 'string' ? event.origin : '';
      if (document.referrer) { const ro = originOf(document.referrer); if (ro && ro !== 'null' && ro !== origin) return; }
      let data = event.data;
      if (typeof data === 'string') {
        if (data.length > 50 * 1024 * 1024) return;
        try { data = JSON.parse(data); } catch (e) { return; }
      }
      if (!isObj(data)) return;
      if (parentOrigin === null) {
        if (data.action !== Action.ComponentRegistered) return;
        parentOrigin = origin;
      } else if (origin !== parentOrigin) return;
      handle(data);
    };
    window.addEventListener('message', onMsg, false);
    document.addEventListener('message', onMsg, false); // RN/mobile
  }

  return {
    init(opts) {
      opts = opts || {};
      saveDelay = typeof opts.debounceSave === 'number' ? opts.debounceSave : 250;
      onNote = opts.onNote || null;
      listen();
      // If no registration arrives we are not inside Standard Notes. Standalone (demo) mode is
      // only allowed when this page is the top-level window: a page opened directly. If some
      // other site embeds us in a frame and never registers, we do nothing rather than load or
      // show locally stored data inside someone else's page.
      setTimeout(() => {
        if (sessionKey) return;
        let topLevel = false; try { topLevel = window.top === window.self; } catch (e) { topLevel = false; }
        if (topLevel) { standalone = true; if (opts.onStandalone) opts.onStandalone(); }
        else if (opts.onUnregistered) opts.onUnregistered();
      }, 1500);
    },
    save,
    flushNow: flush,
    isStandalone() { return standalone; },
    env() { return environment; },
  };
})();

/* ===========================================================================
   PART 2 — Habit tracker application. Data is JSON stored in the note text.
   =========================================================================== */
const App = (function () {
  const SCHEMA = 1;
  const COLORS = ['#2f6fed','#30a46c','#f5a623','#e5484d','#8e4ec6','#0aa5b8','#d6409f','#a18072'];
  const ICONS = ['🚴','💪','📖','✍️','🏃','🧘','💧','🥗','😴','🎸','🧹','💊','☀️','📵'];
  const MILESTONES = [7,14,30,60,100,180,365];

  let data=null, dirty=false, editingId=null, standalone=false;
  const undoStack=[]; let lastSerialized=null; let lastRenderDay=null;
  let monthOffset=0, monthHabit=''; let lastXPSeen=null; let journalQuery=''; let trainRange=6; let healthDismissed=false; const jExpanded=new Set(); let jDraft={};

    const created = h.createdAt ? h.createdAt.slice(0,10) : logMin;
    const start = logMin < created ? logMin : created;
    let best=0,run=0,d=start; while(d<=today){ if(scheduledOn(h,d)){ if(isDoneOn(h,d)){ run++; best=Math.max(best,run);} else if(isSkipped(h,d)){ /* neutral */ } else run=0; } d=addDays(d,1); } return best;
  }
  function completionRate(h,days){ const today=todayStr(); let sched=0,done=0;
    for(let i=0;i<days;i++){ const d=addDays(today,-i); if(scheduledOn(h,d) && !isSkipped(h,d)){ sched++; if(isDoneOn(h,d)) done++; } } return sched?Math.round(done/sched*100):0; }
  function totalDone(h){ const m=data.log[h.id]||{}; return Object.keys(m).filter(k=>isDoneOn(h,k)).length; }
  function isSkipped(h,iso){ return logVal(h,iso)==='skip'; }
  function sumInRange(h,days){ const today=todayStr(); let s=0,n=0; for(let i=0;i<days;i++){ const v=logVal(h,addDays(today,-i)); if(typeof v==='number'){ s+=v; n++; } } return {sum:s,activeDays:n}; }
  function monthTotal(h){ const ym=todayStr().slice(0,7); const m=data.log[h.id]||{}; let s=0; Object.keys(m).forEach(k=>{ if(k.slice(0,7)===ym && typeof m[k]==='number') s+=m[k]; }); return s; }
  function sparkline(h,days){ const today=todayStr(); const vals=[]; for(let i=days-1;i>=0;i--){ const v=logVal(h,addDays(today,-i)); vals.push(typeof v==='number'?v:0); }
    const max=Math.max(1,...vals); const wrap=el('div','spark'); wrap.title='Last '+days+' days';
    vals.forEach(v=>{ const sp=el('span'); sp.style.height=Math.max(2,Math.round(v/max*30))+'px'; sp.style.background=v>0?safeColor(h.color,'var(--accent)'):'var(--border)'; wrap.appendChild(sp); });
    return wrap; }
  // "due on a specific day" — excludes weekly-target habits (which aren't pinned to a day)
  function dueOnStrict(h,iso){ const s=h.schedule||{type:'daily'}; if(s.type==='weekly') return false; if(s.type==='days'){ const w=new Date(iso+'T00:00:00').getDay(); return (s.days||[]).includes(w); } return true; }
  function perfectDaysCount(days){ const today=todayStr(); const act=data.habits.filter(h=>!h.archived); let n=0;
    for(let i=0;i<days;i++){ const d=addDays(today,-i); const due=act.filter(h=>dueOnStrict(h,d)); if(due.length && due.every(h=>isDoneOn(h,d))) n++; } return n; }
  function moveHabit(hid,dir){ const i=data.habits.findIndex(h=>h.id===hid); const j=i+dir; if(i<0||j<0||j>=data.habits.length) return; const a=data.habits; const t=a[i]; a[i]=a[j]; a[j]=t; persist(); render(); }
  // streak at risk = scheduled today, not done yet, and an active streak that today would break
  function atRisk(h){ const today=todayStr(); if((h.schedule||{}).type==='weekly') return false; if(!scheduledOn(h,today)) return false; if(isSkipped(h,today)) return false; if(isDoneOn(h,today)) return false; return currentStreak(h)>=2; }
  function highestMilestone(streak){ let m=0; MILESTONES.forEach(x=>{ if(streak>=x) m=x; }); return m; }
  function noteFor(hid,iso){ return (data.notes[hid]||{})[iso]||''; }

  /* ---- Gamification: XP + levels + achievements (all derived from the log, so undo-safe) ---- */
  const XP_PER_DONE=10, XP_PER_PERFECT=25;
  const LEVEL_TITLES=['Seedling','Sprout','Steady','Consistent','Committed','Disciplined','Habitual','Ingrained','Relentless','Unshakeable','Master'];
  function totalCompletions(){ let n=0; data.habits.forEach(h=>{ n+=totalDone(h); }); return n; }
  function perfectDaysAllTime(){ const f=firstLogDate(); if(!f) return 0; const today=todayStr(); const act=data.habits.filter(h=>!h.archived);
    let n=0, d=f, guard=0; while(d<=today && guard++<20000){ const due=act.filter(h=>dueOnStrict(h,d)); if(due.length && due.every(h=>isDoneOn(h,d))) n++; d=addDays(d,1); } return n; }
  function consecutivePerfectDays(){ const f=firstLogDate(); if(!f) return 0; const today=todayStr(); const act=data.habits.filter(h=>!h.archived);
    let best=0, run=0, d=f, guard=0; while(d<=today && guard++<20000){ const due=act.filter(h=>dueOnStrict(h,d)); if(due.length && due.every(h=>isDoneOn(h,d))){ run++; best=Math.max(best,run); } else run=0; d=addDays(d,1); } return best; }
  function longestStreakAny(){ let m=0; data.habits.forEach(h=>{ m=Math.max(m,longestStreak(h)); }); return m; }
  function milestoneXP(){ let x=0; data.habits.forEach(h=>{ const ls=longestStreak(h); MILESTONES.forEach(m=>{ if(ls>=m) x+=m*2; }); }); return x; }
  function totalXP(){ return totalCompletions()*XP_PER_DONE + perfectDaysAllTime()*XP_PER_PERFECT + milestoneXP(); }
  function cumXP(L){ return 50*(L-1)*L; }   // XP to reach level L: L1=0, L2=100, L3=300, L4=600, L5=1000 …
  function levelInfo(xp){ let L=1; while(cumXP(L+1)<=xp && L<999) L++; const cur=cumXP(L), nxt=cumXP(L+1);
    return { level:L, into:xp-cur, need:nxt-cur, pct: (nxt-cur)?Math.min(100,Math.round((xp-cur)/(nxt-cur)*100)):100, title:LEVEL_TITLES[Math.min(L-1,LEVEL_TITLES.length-1)] }; }
  function comebackDone(){ const today=todayStr(); const f=firstLogDate(); if(!f) return false;
    return data.habits.some(h=>{ if((h.schedule||{}).type==='weekly') return false; let run=0, armed=false, d=f, guard=0;
      while(d<=today && guard++<20000){ if(scheduledOn(h,d)){ if(isDoneOn(h,d)){ if(armed) return true; run++; } else if(isSkipped(h,d)){ /* neutral */ } else { if(run>=5) armed=true; run=0; } } d=addDays(d,1); } return false; }); }
  const ACHIEVEMENTS=[
    { id:'first',       icon:'👣', name:'First step',     desc:'Complete a habit for the first time', earned:()=>totalCompletions()>=1 },
    { id:'ten',         icon:'🌿', name:'Taking root',    desc:'10 total completions',                earned:()=>totalCompletions()>=10 },
    { id:'fifty',       icon:'🌳', name:'Growing strong', desc:'50 total completions',                earned:()=>totalCompletions()>=50 },
    { id:'hundred',     icon:'💯', name:'Centurion',      desc:'100 total completions',               earned:()=>totalCompletions()>=100 },
    { id:'fivehundred', icon:'🏔️', name:'Summit',         desc:'500 total completions',               earned:()=>totalCompletions()>=500 },
    { id:'streak7',     icon:'🔥', name:'On fire',        desc:'Reach a 7-day streak',   quiet:true,  earned:()=>longestStreakAny()>=7 },
    { id:'streak30',    icon:'🗓️', name:'Monthly master', desc:'Reach a 30-day streak',  quiet:true,  earned:()=>longestStreakAny()>=30 },
    { id:'streak100',   icon:'💎', name:'Diamond streak', desc:'Reach a 100-day streak', quiet:true,  earned:()=>longestStreakAny()>=100 },
    { id:'perfect1',    icon:'⭐', name:'Perfect day',    desc:'Complete every scheduled habit in a day', earned:()=>perfectDaysAllTime()>=1 },
    { id:'perfect7',    icon:'🌟', name:'Perfect week',   desc:'7 perfect days in a row',             earned:()=>consecutivePerfectDays()>=7 },
    { id:'comeback',    icon:'💪', name:'Comeback',       desc:'Bounce back after breaking a 5+ day streak', earned:()=>comebackDone() },
    { id:'collector',   icon:'🧩', name:'Well-rounded',   desc:'Track 5 or more habits',              earned:()=>data.habits.filter(h=>!h.archived).length>=5 },
    { id:'reflective',  icon:'📓', name:'Reflective',     desc:'Write 10 journal reflections',        earned:()=>journalEntries().length>=10 },
    { id:'level5',      icon:'🏅', name:'Level 5',        desc:'Reach level 5',          quiet:true,  earned:()=>levelInfo(totalXP()).level>=5 },
    { id:'level10',     icon:'👑', name:'Level 10',       desc:'Reach level 10',         quiet:true,  earned:()=>levelInfo(totalXP()).level>=10 },
  ];
  function earnedAchievements(){ return ACHIEVEMENTS.filter(a=>{ try{ return a.earned(); }catch(e){ return false; } }); }
  function ensureGamSeed(){ data.gam=data.gam||{};
    if(!data.gam.initialized){ data.gam.seenAch=earnedAchievements().map(a=>a.id); data.gam.seenLevel=levelInfo(totalXP()).level; data.gam.initialized=true; }
    if(!Array.isArray(data.gam.seenAch)) data.gam.seenAch=[]; if(typeof data.gam.seenLevel!=='number') data.gam.seenLevel=1; }
  function checkUnlocks(){
    if(!data.gam || !data.gam.initialized) return;
    const earned=earnedAchievements(); const earnedIds=earned.map(a=>a.id);
    const newly=earned.filter(a=>!data.gam.seenAch.includes(a.id));
    const lvl=levelInfo(totalXP()).level; const leveledUp=lvl>(data.gam.seenLevel||1);
    if(!newly.length && !leveledUp) return;
    data.gam.seenAch=earnedIds; data.gam.seenLevel=lvl; persist();
    const queue=[];
    if(leveledUp) queue.push({ type:'level', level:lvl, title:levelInfo(totalXP()).title });
    newly.filter(a=>!a.quiet).forEach(a=>queue.push({ type:'ach', ach:a }));
    showRewards(queue);
  }
  function showRewards(queue){ if(!queue.length||!settings().celebrate) return; let i=0; const next=()=>{ if(i>=queue.length) return; rewardModal(queue[i++], next); }; next(); }
  function rewardModal(it, done){

  function levelBar(){ const info=levelInfo(totalXP()); const wrap=el('div','levelbar');
    wrap.innerHTML='<div class="lv-badge">'+info.level+'</div>'
      +'<div class="lv-main"><div class="lv-top"><span class="lv-title">Level '+info.level+' · '+esc(info.title)+'</span>'

  function trophyCase(){ const earned=new Set(earnedAchievements().map(a=>a.id)); const info=levelInfo(totalXP());
    const sec=el('div','trophies');
    sec.appendChild(el('div','tr-head','🏆 Level '+info.level+' · '+esc(info.title)+' · '+totalXP()+' XP · '+earned.size+'/'+ACHIEVEMENTS.length+' badges'));
    const grid=el('div','tr-grid');
    ACHIEVEMENTS.forEach(a=>{ const got=earned.has(a.id); const cell=el('div','tr-badge'+(got?' got':''));
      cell.title=a.name+' — '+a.desc+(got?'':' (locked)');
      cell.innerHTML='<div class="tr-ic">'+(got?a.icon:'🔒')+'</div><div class="tr-name">'+esc(a.name)+'</div>'; grid.appendChild(cell); });
    sec.appendChild(grid); return sec; }

  /* ---- Insights: quantitative trends (all local, no AI) ---- */
  function activeHabits(){ return data.habits.filter(h=>!h.archived); }
  function firstLogDate(){ let min=null; Object.keys(data.log||{}).forEach(hid=>Object.keys(data.log[hid]||{}).forEach(d=>{ if(d!=='skip' && (!min||d<min)) min=d; })); return min; }
  function historyDays(){ const f=firstLogDate(); if(!f) return 0; return Math.round((new Date(todayStr()+'T00:00:00')-new Date(f+'T00:00:00'))/86400000)+1; }
  // combined completion over `len` days ending `offset` days before today (offset 0 = last `len` days incl today)
  function combinedRate(offset,len){ const today=todayStr(); let sched=0,done=0; const act=activeHabits();
    for(let i=0;i<len;i++){ const d=addDays(today,-(offset+i)); act.forEach(h=>{ if(scheduledOn(h,d)&&!isSkipped(h,d)){ sched++; if(isDoneOn(h,d)) done++; } }); }
    return { sched, done, rate: sched?Math.round(done/sched*100):null }; }
  function weeklyRates(nWeeks){ const arr=[]; for(let w=0;w<nWeeks;w++) arr.push(combinedRate(w*7,7)); return arr.reverse(); }
  function dowRates(nDays){ const today=todayStr(); const b=Array.from({length:7},()=>({sched:0,done:0})); const act=activeHabits();
    for(let i=0;i<nDays;i++){ const d=addDays(today,-i); const dow=dowIndex(d);
      act.forEach(h=>{ if(scheduledOn(h,d)&&!isSkipped(h,d)){ b[dow].sched++; if(isDoneOn(h,d)) b[dow].done++; } }); }
    return b.map(x=>({sched:x.sched,done:x.done,rate:x.sched?Math.round(x.done/x.sched*100):null})); }
  function rateBack(h,fromOffset,len){ const today=todayStr(); let s=0,dn=0; for(let i=0;i<len;i++){ const d=addDays(today,-(fromOffset+i)); if(scheduledOn(h,d)&&!isSkipped(h,d)){ s++; if(isDoneOn(h,d)) dn++; } } return s?Math.round(dn/s*100):null; }
  function habitMomentum(h){ const recent=rateBack(h,0,14), prior=rateBack(h,14,14); let dir='steady';
    if(recent!=null&&prior!=null){ const diff=recent-prior; dir=diff>=10?'up':diff<=-10?'down':'steady'; } else if(recent!=null&&prior==null){ dir='new'; }
    return { recent, prior, dir }; }
  function coOccur(a,b,nDays){ const today=todayStr(); let aDone=0,both=0; for(let i=0;i<nDays;i++){ const d=addDays(today,-i); if(scheduledOn(a,d)&&scheduledOn(b,d)&&isDoneOn(a,d)){ aDone++; if(isDoneOn(b,d)) both++; } } return { aDone, both, pct: aDone?Math.round(both/aDone*100):null }; }
  function bestPairing(nDays){ const act=activeHabits(); let best=null; for(let i=0;i<act.length;i++) for(let j=0;j<act.length;j++){ if(i===j) continue; const c=coOccur(act[i],act[j],nDays); if(c.aDone>=4 && c.pct!=null && (!best||c.pct>best.pct)) best={a:act[i],b:act[j],pct:c.pct,aDone:c.aDone}; } return best; }
  function skipCount(nDays){ const today=todayStr(); let n=0; const act=activeHabits(); for(let i=0;i<nDays;i++){ const d=addDays(today,-i); act.forEach(h=>{ if(isSkipped(h,d)) n++; }); } return n; }


  /* ---- Insights: mood (from the 1–5 faces on journal entries; several entries on a day are averaged) ---- */
  function moodByDay(){ const acc={}; (data.entries||[]).forEach(e=>{ if(e.mood>0){ (acc[e.date]=acc[e.date]||[]).push(e.mood); } });
    const out={}; Object.keys(acc).forEach(d=>{ out[d]=acc[d].reduce((a,b)=>a+b,0)/acc[d].length; }); return out; }
  function moodWindow(mb,offset,len){ const today=todayStr(); let s=0,n=0; for(let i=0;i<len;i++){ const d=addDays(today,-(offset+i)); if(mb[d]){ s+=mb[d]; n++; } } return {avg:n?s/n:null,n}; }
  function moodWeekly(mb,nWeeks){ const ws0=startOfWeek(todayStr()); const out=[]; for(let w=nWeeks-1;w>=0;w--){ const ws=addDays(ws0,-7*w); let s=0,n=0; for(let i=0;i<7;i++){ const v=mb[addDays(ws,i)]; if(v){ s+=v; n++; } } out.push({ws,avg:n?s/n:null,n}); } return out; }
  // average mood on days a habit was done vs scheduled-but-not-done (rest days excluded); needs >=3 days on each side
  function moodVsHabits(mb,nDays){ const today=todayStr(); const rows=[];
    const split=(isOn,isCandidate)=>{ let a=0,an=0,b=0,bn=0; for(let i=0;i<nDays;i++){ const d=addDays(today,-i); const m=mb[d]; if(!m||!isCandidate(d)) continue; if(isOn(d)){ a+=m; an++; } else { b+=m; bn++; } }
      return (an>=3&&bn>=3)?{on:a/an,off:b/bn,nOn:an,nOff:bn,diff:a/an-b/bn}:null; };
    activeHabits().forEach(h=>{ const r=split(d=>isDoneOn(h,d), d=>scheduledOn(h,d)&&!isSkipped(h,d)); if(r) rows.push(Object.assign({label:h.name,icon:h.icon||'•',color:h.color},r)); });
    if(workoutHabits().length){ const r=split(d=>dayWorkout(d).c>0, ()=>true); if(r) rows.push(Object.assign({label:'Any workout',icon:'🏋️',color:null},r)); }
    return rows.sort((x,y)=>Math.abs(y.diff)-Math.abs(x.diff)); }
  function moodCard(){
    const mb=moodByDay(); const s=el('div','ins-card'); s.appendChild(el('h4',null,'Mood'));
    const rated=Object.keys(mb).length;
    if(rated<5){ s.appendChild(el('div','small','Tap a face when you write a journal entry to rate your mood. Trends appear after 5 rated days ('+rated+' so far).')); return s; }
    const r30=moodWindow(mb,0,30), p30=moodWindow(mb,30,30);
    if(r30.avg!=null){ let tr='', cls='steady'; if(p30.avg!=null&&p30.n>=3){ const d=Math.round((r30.avg-p30.avg)*10)/10; if(d>=0.3){ tr='↑ up '+d; cls='up'; } else if(d<=-0.3){ tr='↓ down '+Math.abs(d); cls='down'; } else tr='→ steady'; }
      s.appendChild(el('div','ins-big', (Math.round(r30.avg*10)/10)+'<span class="ins-of">/5</span> '+moodEmoji(r30.avg)+(tr?' <span class="ins-trend '+cls+'">'+tr+'</span>':'')));
      s.appendChild(el('div','small','Average mood, last 30 days ('+r30.n+' rated day'+(r30.n===1?'':'s')+')'+(p30.avg!=null&&p30.n>=3?(' · prior 30 days: '+(Math.round(p30.avg*10)/10)):'')+'.')); }
    else s.appendChild(el('div','small','No rated days in the last 30 days.'));
    const wk=moodWeekly(mb,8);
    if(wk.filter(x=>x.avg!=null).length>=2){ s.appendChild(el('div','small','Weekly average (1–5)'));
      const row=el('div','ins-weeks'); wk.forEach((x,i)=>{ const col=el('div','ins-week'); const bar=el('div','ins-vbar'); const f=el('span'); f.style.height=(x.avg?Math.max(3,Math.round(x.avg/5*100)):0)+'%'; bar.appendChild(f); col.appendChild(bar);
        col.appendChild(el('div','ins-wlbl', x.avg==null?'–':String(Math.round(x.avg*10)/10))); const d=new Date(x.ws+'T00:00:00');
        col.appendChild(el('div','ins-wlbl2', i===wk.length-1?'this wk':d.toLocaleDateString(undefined,{month:'short',day:'numeric'})));
        col.title='Week of '+fmtRange(x.ws)+': '+(x.avg==null?'no rated days':(Math.round(x.avg*10)/10)+' avg over '+x.n+' day'+(x.n===1?'':'s')); row.appendChild(col); });
      s.appendChild(row); }
    const rows=moodVsHabits(mb,90);
    s.appendChild(el('div','small ins-sub','Mood on days you did it vs. days you didn’t (last 90 days)'));
    if(!rows.length) s.appendChild(el('div','small','Not enough overlap yet: each habit needs at least 3 rated days done and 3 not done.'));
    rows.slice(0,6).forEach(r=>{ const row=el('div','ins-row');
      row.appendChild(el('div','ins-hname','<span style="color:'+safeColor(r.color,'var(--fg)')+'">'+esc(r.icon)+'</span> '+esc(r.label)));
      const d=Math.round(r.diff*10)/10; const cls=d>=0.5?'up':d<=-0.5?'down':'steady';
      const txt=el('div','ins-mood', (Math.round(r.on*10)/10)+' vs '+(Math.round(r.off*10)/10)+' <span class="ins-trend '+cls+'">'+(d>0?'+':'')+d+'</span>');
      txt.title='Done: '+r.nOn+' rated days · not done: '+r.nOff+' rated days'; row.appendChild(txt);
      row.appendChild(el('div','ins-rval ins-rval-w',r.nOn+' / '+r.nOff+' days')); s.appendChild(row); });
    s.appendChild(el('div','ins-caveat','Association, not cause: you might do more on days you already feel good. Only differences of about 0.5 or more get coloured; smaller ones, or ones based on few days, are mostly noise.'));
    return s; }

  /* ---- Insights: journal text stats (word-counting, not AI understanding) ---- */
  const STOPWORDS=new Set('the a an and or but of to in on for with at by from is are was were be been being it its this that these those i you he she we they them me my your his her our their as so if then than too very just really not no yes do did done doing have has had will would can could should about out up down off over more most some any all also into what when where which who how why got get went day today day tomorrow yesterday felt feel feeling still even much many because went'.split(/\s+/));
  // Everything written: Journal reflections plus per-habit notes (hid is null for reflections).
  function journalEntries(){ const out=[]; (data.entries||[]).forEach(e=>{ if((e.text||'').trim()) out.push({hid:null,date:e.date,text:e.text,mood:e.mood||0}); });
    Object.keys(data.notes||{}).forEach(hid=>{ const m=data.notes[hid]||{}; Object.keys(m).forEach(date=>{ if((m[date]||'').trim()) out.push({hid,date,text:m[date]}); }); }); return out; }
  function tokenize(t){ return String(t||'').toLowerCase().replace(/[^a-z0-9'\s]/g,' ').split(/\s+/).map(w=>w.replace(/^'+|'+$/g,'')).filter(Boolean); }
  const POSW='good great love loved enjoy enjoyed happy strong proud calm focused focus progress win won better best easy easier motivated energized grateful clear rested rest fun excited consistent improving'.split(' ');
  const NEGW='bad tired hard tough struggle struggled skip skipped missed miss sore pain painful stressed anxious frustrated fail failed slow weak difficult exhausted overwhelmed sick lazy behind unmotivated distracted'.split(' ');
  function journalStats(){ const entries=journalEntries(); if(!entries.length) return null;
    const dates=[...new Set(entries.map(e=>e.date))].sort();
    let words=0; const freq={}; let pos=0,neg=0; const perHabit={};
    entries.forEach(e=>{ const toks=tokenize(e.text); words+=toks.length; if(e.hid) perHabit[e.hid]=(perHabit[e.hid]||0)+1;
      toks.forEach(w=>{ if(POSW.includes(w)) pos++; if(NEGW.includes(w)) neg++; if(w.length>=3 && !STOPWORDS.has(w) && !/^\d+$/.test(w)) freq[w]=(freq[w]||0)+1; }); });
    const top=Object.entries(freq).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,15).map(x=>({w:x[0],n:x[1]}));
    let topHabit=null,topN=0; Object.keys(perHabit).forEach(hid=>{ if(perHabit[hid]>topN){ topN=perHabit[hid]; topHabit=hid; } });
    return { count:entries.length, days:dates.length, first:dates[0], last:dates[dates.length-1], words, avg:Math.round(words/entries.length), top, pos, neg, topHabit, topN }; }

  function copyText(text,ok){ let done=false; if(window.navigator&&navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(()=>{done=true;ok&&ok(true);}).catch(fallback); } else fallback();

  /* ---- rendering ---- */
  const $=s=>document.querySelector(s);
  const el=(tag,cls,html)=>{ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; };

  // Build the "All habits + each habit" dropdown with DOM nodes, so a habit name or id

  // small popover menu anchored to a button
  function rowMenu(anchor,items){
    document.querySelectorAll('.rowmenu').forEach(m=>m.remove());

    items.forEach(it=>{ const b=el('button','rowmenu-item'); b.textContent=it.label; b.onclick=()=>{ m.remove(); it.onClick(); }; m.appendChild(b); });
    document.body.appendChild(m);
    const r=anchor.getBoundingClientRect(); let left=Math.min(r.left, window.innerWidth-m.offsetWidth-8); if(left<8) left=8;
    let top=r.bottom+4; if(top+m.offsetHeight>window.innerHeight-8) top=Math.max(8,r.top-m.offsetHeight-4);
    m.style.left=left+'px'; m.style.top=top+'px';
    const off=(e)=>{ if(!m.contains(e.target)&&e.target!==anchor){ m.remove(); document.removeEventListener('mousedown',off); } };

  function collectJournal(){ const out=[];

  /* ---- Light formatting for journal text ----
     Supports: blank line = new paragraph, line break, # / ## / ### headings, - or * bullets,
     1. numbered lists, > quotes, **bold**, *italic*. Built only with createElement + text nodes:
     no user text is ever parsed as HTML, so markup typed into an entry shows up as plain text. */
  function mdInline(parent,s){
    const re=/\*\*([^*\n]+?)\*\*|\*([^*\n\s][^*\n]*?)\*/g; let last=0, m;
    while((m=re.exec(s))){
      if(m.index>last) parent.appendChild(document.createTextNode(s.slice(last,m.index)));
      const n=document.createElement(m[1]!=null?'strong':'em'); n.textContent=m[1]!=null?m[1]:m[2]; parent.appendChild(n);
      last=re.lastIndex; }
    if(last<s.length) parent.appendChild(document.createTextNode(s.slice(last)));
  }
  function renderMd(text){
    const frag=document.createDocumentFragment(); const lines=String(text||'').replace(/\r\n?/g,'\n').split('\n');
    let para=null, list=null, listType='', quote=null;
    const endBlocks=()=>{ para=null; list=null; listType=''; quote=null; };
    lines.forEach(line=>{
      const t=line.trim(); let m;
      if(!t){ endBlocks(); return; }
      if((m=t.match(/^(#{1,3})\s+(.+)$/))){ endBlocks(); const h=el('div','md-h md-h'+m[1].length); mdInline(h,m[2]); frag.appendChild(h); return; }
      const ul=t.match(/^[-*•]\s+(.+)$/), ol=t.match(/^\d{1,3}[.)]\s+(.+)$/);
      if(ul||ol){ const type=ul?'ul':'ol'; para=null; quote=null;
        if(!list||listType!==type){ list=el(type,'md-list'); listType=type; frag.appendChild(list); }
        const li=el('li'); mdInline(li,(ul||ol)[1]); list.appendChild(li); return; }
      if((m=t.match(/^>\s?(.*)$/))){ para=null; list=null; listType='';
        if(!quote){ quote=el('blockquote','md-quote'); frag.appendChild(quote); } else quote.appendChild(el('br'));
        mdInline(quote,m[1]); return; }
      list=null; listType=''; quote=null;
      if(!para){ para=el('p','md-p'); frag.appendChild(para); } else para.appendChild(el('br'));
      mdInline(para,line.replace(/\s+$/,''));
    });
    return frag;
  }
  function wordCount(t){ const m=String(t||'').match(/[\p{L}\p{N}][\p{L}\p{N}'’-]*/gu); return m?m.length:0; }
  function autoGrow(ta,minPx){ const fit=()=>{ ta.style.height='auto'; ta.style.height=Math.max(minPx||0,ta.scrollHeight+2)+'px'; };
    ta.addEventListener('input',fit); setTimeout(fit,0); return fit; }
  // Formatting buttons for people who don't know the shorthand: wrap the selection or prefix its lines.
  function applyFmt(ta,kind){
    const s=ta.selectionStart, e=ta.selectionEnd, v=ta.value, sel=v.slice(s,e);
    if(kind==='b'||kind==='i'){ const mk=kind==='b'?'**':'*';

    const at=allTimeTotals(); if(at.count) summary.appendChild(el('div','small','All-time: '+at.count+' workouts · '+fmtHours(at.min)+' · '+fmtDist(at.dist)));
    wrap.appendChild(summary);
    // weekly volume: one dated row per week, time and distance as separate columns (each on its own scale)
    const volHdr=el('div'); volHdr.style.cssText='display:flex; align-items:center; gap:8px; margin-bottom:6px;';
    volHdr.appendChild(el('div','tr-sec','Weekly volume')); const vsp=el('span'); vsp.style.flex='1'; volHdr.appendChild(vsp);
    const seg=el('div','calzoom'); seg.style.marginBottom='0'; [[6,'6 wks'],[12,'12 wks'],[26,'26 wks']].forEach(o=>{ const b=el('button','calzoom-btn'+(trainRange===o[0]?' on':''),o[1]); b.onclick=()=>{ trainRange=o[0]; render(); }; seg.appendChild(b); }); volHdr.appendChild(seg);
    wrap.appendChild(volHdr);
    const weeks=[]; for(let w=0;w<trainRange;w++){ const ws=addDays(wkStart,-7*w); weeks.push(Object.assign({ws,cur:w===0},weekVolume(ws))); }
    const maxM=Math.max(1,...weeks.map(x=>x.m)), maxD=Math.max(0.01,...weeks.map(x=>x.d));
    const tbl=el('div','tw'); tbl.setAttribute('role','table'); tbl.setAttribute('aria-label','Weekly training volume');
    const th=el('div','tw-row tw-head'); th.setAttribute('role','row');
    ['Week','Time','Distance','Sessions'].forEach((t,i)=>{ const c=el('div','tw-c'+i,t); c.setAttribute('role','columnheader'); th.appendChild(c); }); tbl.appendChild(th);
    weeks.forEach(x=>{ const row=el('div','tw-row'+(x.cur?' cur':'')); row.setAttribute('role','row');
      const met=goalMet(x,g);
      const lbl=el('div','tw-c0'); lbl.textContent=fmtRange(x.ws); if(x.cur) lbl.appendChild(el('span','tw-tag','so far'));
      if(met===true){ const t=el('span','tw-met','✓'); t.title='Weekly goal met'; lbl.appendChild(t); }
      const cell=(v,max,txt,cls)=>{ const c=el('div',cls); const bar=el('div','tw-bar'); const f=el('span'); f.style.width=(v?Math.max(2,Math.round(v/max*100)):0)+'%'; bar.appendChild(f); c.appendChild(bar); c.appendChild(el('div','tw-v',esc(txt))); return c; };
      [lbl, cell(x.m,maxM,x.m?fmtHours(x.m):'–','tw-c1'), cell(x.d,maxD,x.d?fmtDist(x.d):'–','tw-c2'), el('div','tw-c3',x.c?String(x.c):'–')].forEach(c=>{ c.setAttribute('role','cell'); row.appendChild(c); });
      row.title=fmtRange(x.ws)+': '+fmtHours(x.m)+', '+fmtDist(x.d)+', '+x.c+' session'+(x.c===1?'':'s')+(met===true?' · goal met':met===false&&!x.cur?' · goal missed':'');
      tbl.appendChild(row); });
    wrap.appendChild(tbl);
    // by activity, same calendar week as the summary
    wrap.appendChild(el('div','tr-sec','By activity · this week'));
    sh.forEach(h=>{ const a=weekVolume(wkStart,[h]); const row=el('div','tr-hrow');
      row.innerHTML='<span class="tr-hic" style="color:'+safeColor(h.color,'var(--fg)')+'">'+esc(h.icon||'•')+'</span><span class="tr-hname">'+esc(h.name)+'</span><span class="tr-hval">'+(a.c?(fmtHours(a.m)+' · '+fmtDist(a.d)+' · '+a.c+' session'+(a.c===1?'':'s')):'–')+'</span>';
      wrap.appendChild(row); });
    const recent=allWorkouts(45).slice(0,12);
    if(recent.length){ wrap.appendChild(el('div','tr-sec','Recent sessions'));
      recent.forEach(r=>{ const parts=[]; if(+r.m.dist) parts.push(fmtDist(r.m.dist)); if(+r.m.min) parts.push(fmtDur(r.m.min)); if(+r.m.rpe) parts.push('RPE '+(+r.m.rpe));
        const row=el('div','tr-srow'); row.style.cursor='pointer';
        row.innerHTML='<span class="tr-sic" style="color:'+safeColor(r.habit.color,'var(--fg)')+'">'+esc(r.habit.icon||'•')+'</span><span class="tr-sname">'+esc(r.habit.name)+' <span class="tr-sdate">'+esc(fmtDate(r.date))+'</span></span><span class="tr-sval">'+esc(parts.join(' · '))+'</span>';
        row.onclick=()=>openDay(r.habit.id,r.date); wrap.appendChild(row); });
    }
    return wrap;
  }

  function uiInfo(message){
    const ov=el('div','overlay'); ov.style.display='flex'; ov.style.zIndex='120';
    const box=el('div','modal'); box.style.maxWidth='360px';
    box.appendChild(el('div','modal-body','<div>'+esc(message)+'</div>'));
    const foot=el('div','modal-foot'); foot.style.justifyContent='flex-end'; const ok=el('button','primary','OK'); ok.onclick=()=>ov.remove(); foot.appendChild(ok);
    box.appendChild(foot); ov.appendChild(box); document.body.appendChild(ov); ov.addEventListener('mousedown',e=>{ if(e.target===ov) ov.remove(); });
  }
  function openImport(){
    const fi=document.createElement('input'); fi.type='file'; fi.accept='.csv,text/csv,text/plain'; fi.style.display='none'; document.body.appendChild(fi);
    fi.onchange=()=>{ const file=fi.files&&fi.files[0]; fi.remove(); if(!file) return;
      const rd=new FileReader(); rd.onload=()=>{ let p; try{ p=parseGarminCSV(String(rd.result)); }catch(e){ p={activities:[],types:[],error:'Could not parse that file.'}; } importModal(p); };
      rd.onerror=()=>importModal({activities:[],types:[],error:'Could not read that file.'}); rd.readAsText(file); };
    fi.click();
  }
  function importModal(parsed){
    const ov=el('div','overlay'); ov.style.display='flex'; ov.style.zIndex='115';
    const box=el('div','modal'); box.style.maxWidth='480px';
    const head=el('div','modal-head','<strong style="flex:1">Import Garmin workouts</strong>');

    const body=el('div','modal-body');

      body.appendChild(el('div','small', esc(parsed.error||'No workouts with distance, time or RPE were found in that file.')));
      body.appendChild(el('div','small','In Garmin Connect on the web: open <strong>Activities</strong>, then use <strong>Export CSV</strong> (top-right of the list) and pick that file here.'));
      const foot=el('div','modal-foot'); foot.style.justifyContent='flex-end'; const ok=el('button','ghost','Close'); ok.onclick=()=>ov.remove(); foot.appendChild(ok);
      box.appendChild(head); box.appendChild(body); box.appendChild(foot); ov.appendChild(box); document.body.appendChild(ov); ov.addEventListener('mousedown',e=>{ if(e.target===ov) ov.remove(); }); return;
    }
    body.appendChild(el('div','small','Found <strong>'+parsed.activities.length+'</strong> activities'+(parsed.first?(' ('+esc(parsed.first)+' → '+esc(parsed.last)+')'):'')+(parsed.skipped?('. '+parsed.skipped+' rows skipped or duplicate'):'')+'.'));
    const unitWrap=el('div','field'); unitWrap.appendChild(el('label',null,'Distance unit in the file'));
    const unitSel=el('select'); [['mi','Miles'],['km','Kilometers']].forEach(o=>{ const op=el('option'); op.value=o[0]; op.textContent=o[1]; unitSel.appendChild(op); }); unitWrap.appendChild(unitSel); body.appendChild(unitWrap);
    body.appendChild(el('div','small','Send each activity type to a habit:'));
    const maps={}; const habitOpts=data.habits.filter(h=>!h.archived);
    parsed.types.forEach(t=>{ const f=el('div','field'); f.appendChild(el('label',null,esc(t)));
      const sel=el('select'); const sk=el('option'); sk.value='skip'; sk.textContent='— skip —'; sel.appendChild(sk);
      habitOpts.forEach(h=>{ const op=el('option'); op.value=h.id; op.textContent=h.name; sel.appendChild(op); });
      sel.value=guessHabit(t)||'skip'; maps[t]=sel.value; sel.onchange=()=>{ maps[t]=sel.value; }; f.appendChild(sel); body.appendChild(f); });
    const polWrap=el('div','field'); polWrap.appendChild(el('label',null,'If a day already has data'));
    const pol=el('select'); [['skip','Keep what I already have (recommended)'],['overwrite','Replace it with the import'],['add','Add them together']].forEach(o=>{ const op=el('option'); op.value=o[0]; op.textContent=o[1]; pol.appendChild(op); }); polWrap.appendChild(pol); body.appendChild(polWrap);
    const mdLbl=el('label','small'); mdLbl.style.cssText='display:flex; align-items:center; gap:8px; cursor:pointer;'; const md=el('input'); md.type='checkbox'; md.checked=true; md.style.cssText='width:auto; margin:0;'; mdLbl.appendChild(md); mdLbl.appendChild(document.createTextNode(' Mark the habit complete on workout days')); body.appendChild(mdLbl);
    const foot=el('div','modal-foot'); foot.style.justifyContent='flex-end';
    const cancel=el('button','ghost','Cancel'); cancel.onclick=()=>ov.remove();
    const imp=el('button','primary','Import'); imp.onclick=()=>{ const res=applyImport(parsed, maps, unitSel.value, pol.value, md.checked); ov.remove();
      uiInfo('Imported '+res.days+' day'+(res.days===1?'':'s')+' of workouts'+(res.markedDone?(' · '+res.markedDone+' days marked complete'):'')+(res.skippedExisting?(' · '+res.skippedExisting+' existing days kept'):'')+'.'); };
    foot.appendChild(cancel); foot.appendChild(imp);
    box.appendChild(head); box.appendChild(body); box.appendChild(foot); ov.appendChild(box); document.body.appendChild(ov);
    ov.addEventListener('mousedown',e=>{ if(e.target===ov) ov.remove(); });
  }

  /* ---- habit editor ---- */
  let pickIcon=ICONS[0], pickColor=COLORS[0], pickDays=[1,2,3,4,5];
  function openEditor(hid){
    editingId=hid; const h=data.habits.find(x=>x.id===hid); if(!h) return;
    $('#h_name').value=h.name; pickIcon=h.icon||ICONS[0]; pickColor=h.color||COLORS[0];
    $('#h_sched').value=(h.schedule&&h.schedule.type)||'daily';
    pickDays=(h.schedule&&h.schedule.days&&h.schedule.days.slice())||[1,2,3,4,5];
    $('#h_target').value=(h.schedule&&h.schedule.target)||3;
    $('#h_track').value=h.track||'check'; $('#h_goal').value=h.goal||1; $('#h_unit').value=h.unit||'';
    $('#h_workout').checked=!!h.workout;
    $('#h_archive').textContent=h.archived?'Unarchive':'Archive';
    renderIconPick(); renderColorPick(); renderDayPick(); syncSchedFields();
    $('#overlay').classList.add('open'); $('#h_name').focus();
  }
  function renderIconPick(){ const box=$('#h_icons'); box.innerHTML=''; ICONS.forEach(ic=>{ const b=el('button',pickIcon===ic?'on':'',ic); b.onclick=()=>{ pickIcon=ic; renderIconPick(); }; box.appendChild(b); }); }
  function renderColorPick(){ const box=$('#h_colors'); box.innerHTML=''; COLORS.forEach(c=>{ const b=el('button',pickColor===c?'on':''); b.style.background=c; b.onclick=()=>{ pickColor=c; renderColorPick(); }; box.appendChild(b); }); }
  function renderDayPick(){ const box=$('#h_days'); box.innerHTML=''; const lbl=['Su','Mo','Tu','We','Th','Fr','Sa'];
    for(let d=0;d<7;d++){ const b=el('button','dow-btn'+(pickDays.includes(d)?' on':''),lbl[d]); b.onclick=()=>{ if(pickDays.includes(d)) pickDays=pickDays.filter(x=>x!==d); else pickDays.push(d); renderDayPick(); }; box.appendChild(b); } }
  function syncSchedFields(){ const t=$('#h_sched').value; $('#h_daysWrap').style.display=t==='days'?'block':'none'; $('#h_targetWrap').style.display=t==='weekly'?'block':'none';
    const count=$('#h_track').value==='count';
    $('#h_goalWrap').style.display=count?'block':'none'; $('#h_unitWrap').style.display=count?'block':'none'; }
  function commitEditor(){ if(!editingId) return; const h=data.habits.find(x=>x.id===editingId); if(!h) return;
    h.name=$('#h_name').value.trim()||'Untitled'; h.icon=pickIcon; h.color=pickColor;
    const t=$('#h_sched').value; const sched={type:t}; if(t==='days') sched.days=pickDays.slice().sort(); if(t==='weekly') sched.target=Math.max(1,Math.min(7,parseInt($('#h_target').value,10)||3));
    h.schedule=sched; h.track=$('#h_track').value; h.goal=Math.max(1,parseInt($('#h_goal').value,10)||1); h.unit=$('#h_unit').value.trim(); h.workout=$('#h_workout').checked; persist(); }
  function closeEditor(){ commitEditor(); editingId=null; $('#overlay').classList.remove('open'); render(); }

  /* ---- wiring ---- */
  function wire(){
    document.querySelectorAll('#viewSeg button').forEach(b=>{ b.onclick=()=>{ data.ui.view=b.dataset.view; saveOut(); render(); }; });
    $('#addBtn').onclick=()=>{ const h={ id:id(), name:'New habit', icon:ICONS[Math.floor(Math.random()*ICONS.length)], color:COLORS[data.habits.length%COLORS.length], schedule:{type:'daily'}, track:'check', goal:1, unit:'', workout:false, archived:false, createdAt:new Date().toISOString() };
      data.habits.push(h); persist(); render(); openEditor(h.id); };
    $('#undoBtn').onclick=undo;
    $('#settingsBtn').onclick=openSettings;
    $('#h_close').onclick=closeEditor; $('#h_save').onclick=closeEditor;
    $('#overlay').addEventListener('mousedown',e=>{ if(e.target.id==='overlay') closeEditor(); });
    $('#h_sched').onchange=()=>{ syncSchedFields(); commitEditor(); }; $('#h_track').onchange=()=>{ syncSchedFields(); commitEditor(); };
    ['h_name','h_target','h_goal','h_unit'].forEach(idn=>{ const e=document.getElementById(idn); e.onchange=commitEditor; });
    $('#h_archive').onclick=()=>{ const h=data.habits.find(x=>x.id===editingId); if(!h) return; h.archived=!h.archived; editingId=null; $('#overlay').classList.remove('open'); persist(); render(); };
    $('#h_delete').onclick=()=>{ if(!editingId) return; const tid=editingId;
      uiConfirm('Delete this habit and its history?', ()=>{ data.habits=data.habits.filter(x=>x.id!==tid); delete data.log[tid]; delete data.notes[tid]; if(data.metrics) delete data.metrics[tid]; editingId=null; $('#overlay').classList.remove('open'); persist(); render(); }); };
    document.addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&(e.key==='z'||e.key==='Z')){ e.preventDefault(); undo(); } if(e.key==='Escape'&&$('#overlay').classList.contains('open')) closeEditor(); });
    window.addEventListener('beforeunload',()=>{ if(dirty) SNBridge.flushNow(); });
    $('#archBtn').onclick=openArchived;
    $('#h_up').onclick=()=>{ if(editingId) moveHabit(editingId,-1); };
    $('#h_down').onclick=()=>{ if(editingId) moveHabit(editingId,1); };
    // roll the Today view over to the new day automatically if left open past midnight
    setInterval(()=>{ if(data && lastRenderDay && todayStr()!==lastRenderDay) render(); }, 60000);
  }

  function openArchived(){
    const arch=data.habits.filter(h=>h.archived);
    const ov=el('div','overlay'); ov.style.display='flex'; ov.style.zIndex='100';
    const box=el('div','modal'); box.style.maxWidth='380px';
    const head=el('div','modal-head','<strong style="flex:1">Archived habits</strong>');
    const close=el('button','iconbtn','✕'); close.onclick=()=>ov.remove(); head.appendChild(close);
    const body=el('div','modal-body');
    if(!arch.length) body.appendChild(el('div','small','No archived habits.'));
    arch.forEach(h=>{
      const row=el('div','hrow');
      const ic=el('div','hicon'); ic.textContent=h.icon||'•'; ic.style.color=safeColor(h.color,'var(--fg)');
      row.appendChild(ic); row.appendChild(el('div','hname',esc(h.name)));
      const un=el('button','ghost','Unarchive'); un.onclick=()=>{ h.archived=false; persist(); ov.remove(); render(); };
      const del=el('button','danger','Delete'); del.onclick=()=>{ const tid=h.id; ov.remove();
        uiConfirm('Delete this habit and its history?', ()=>{ data.habits=data.habits.filter(x=>x.id!==tid); delete data.log[tid]; delete data.notes[tid]; if(data.metrics) delete data.metrics[tid]; persist(); render(); }); };
      row.appendChild(un); row.appendChild(del); body.appendChild(row);
    });
    box.appendChild(head); box.appendChild(body); ov.appendChild(box); document.body.appendChild(ov);
    ov.addEventListener('mousedown',e=>{ if(e.target===ov) ov.remove(); });
  }

  /* ---- export / backup (all local) ---- */
  function csvCell(v){ v=String(v==null?'':v); return /[",\n]/.test(v)?('"'+v.replace(/"/g,'""')+'"'):v; }
  function buildCSV(){
    const rows=[['date','habit','status','count','distance_'+distUnit(),'minutes','rpe','note']];
    const act=data.habits;
    act.forEach(h=>{ const lg=data.log[h.id]||{}; const mt=data.metrics[h.id]||{}; const nt=data.notes[h.id]||{};
      const dates=new Set([...Object.keys(lg),...Object.keys(mt),...Object.keys(nt)]);
      Array.from(dates).sort().forEach(d=>{ const v=lg[d]; const m=mt[d]||{};
        const status=v==='skip'?'rest':(v===true?'done':(typeof v==='number'?'count':''));
        rows.push([d,h.name,status,(typeof v==='number'?v:''),(m.dist?(Math.round(distDisp(m.dist)*100)/100):''),(m.min||''),(m.rpe||''),nt[d]||'']); }); });
    (data.entries||[]).forEach(e=>rows.push([e.date,'(journal)','entry','','','','',e.text]));
    return rows.map(r=>r.map(csvCell).join(',')).join('\n');
  }
  function tryDownload(name,text,mime){ try{ const a=document.createElement('a'); a.href='data:'+(mime||'text/plain')+';charset=utf-8,'+encodeURIComponent(text); a.download=name; document.body.appendChild(a); a.click(); a.remove(); return true; }catch(e){ return false; } }
  function exportBlock(label,getText,filename,mime){
    const box=el('div','field'); box.appendChild(el('label',null,label));
    const row=el('div'); row.style.cssText='display:flex; gap:8px; flex-wrap:wrap; align-items:center;';
    const dl=el('button','ghost','⤓ Download'); const cp=el('button','ghost','Copy'); const msg=el('span','small');
    const pv=el('textarea'); pv.readOnly=true; pv.style.cssText='width:100%; min-height:120px; margin-top:6px; display:none; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:8px; font-family:ui-monospace,Menlo,monospace; font-size:12px;';
    dl.onclick=()=>{ if(!tryDownload(filename,getText(),mime)){ pv.value=getText(); pv.style.display=''; pv.focus(); pv.select(); msg.textContent='If nothing downloaded, copy from the box.'; } };
    cp.onclick=()=>{ copyText(getText(),okd=>{ if(okd){ msg.textContent='Copied ✓'; setTimeout(()=>msg.textContent='',2500); } else { pv.value=getText(); pv.style.display=''; pv.focus(); pv.select(); } }); };
    row.appendChild(dl); row.appendChild(cp); row.appendChild(msg); box.appendChild(row); box.appendChild(pv); return box;
  }
  function restoreFromText(text){ let p=null; try{ p=JSON.parse(text); }catch(e){ uiInfo('That file isn’t valid JSON.'); return; }
    if(!p||!Array.isArray(p.habits)){ uiInfo('That doesn’t look like a Habits backup.'); return; }
    uiConfirm('Replace ALL current habits and history with this backup? This can’t be undone.', ()=>{ data=migrate(p); ensureGamSeed(); persist(); render(); uiInfo('Backup restored.'); }); }
  function openSettings(){
    const ov=el('div','overlay'); ov.style.display='flex'; ov.style.zIndex='115';
    const box=el('div','modal'); box.style.maxWidth='460px';
    const head=el('div','modal-head','<strong style="flex:1">⚙ Settings & backup</strong>');
    const close=el('button','iconbtn','✕'); close.setAttribute('aria-label','Close'); close.onclick=()=>ov.remove(); head.appendChild(close);
    const body=el('div','modal-body');
    const st=settings();
    const selField=(label,opts,val,on)=>{ const f=el('div','field'); f.appendChild(el('label',null,label)); const sel=el('select'); opts.forEach(o=>{ const op=el('option'); op.value=o[0]; op.textContent=o[1]; sel.appendChild(op); }); sel.value=val; sel.onchange=()=>{ on(sel.value); persist(); render(); }; f.appendChild(sel); return f; };
    body.appendChild(selField('Distance unit',[['mi','Miles'],['km','Kilometers']],st.unit,v=>{ data.settings.unit=v; }));
    body.appendChild(selField('Week starts on',[['1','Monday'],['0','Sunday']],String(st.weekStart),v=>{ data.settings.weekStart=v==='0'?0:1; }));
    const cf=el('label','opt-check'); cf.style.cssText='display:flex; align-items:center; gap:8px; margin:6px 0;'; const cb=el('input'); cb.type='checkbox'; cb.checked=st.celebrate!==false; cb.style.cssText='width:auto;margin:0;'; cb.onchange=()=>{ data.settings.celebrate=cb.checked; persist(); }; cf.appendChild(cb); cf.appendChild(document.createTextNode(' Show celebration pop-ups (streaks, levels, badges)')); body.appendChild(cf);
    body.appendChild(el('div','small','Everything below stays on this device until you save or paste it somewhere yourself.'));
    body.appendChild(exportBlock('Full backup (JSON) — restore-able', ()=>JSON.stringify(data), 'habits-backup-'+todayStr()+'.json','application/json'));
    body.appendChild(exportBlock('Spreadsheet (CSV)', buildCSV, 'habits-'+todayStr()+'.csv','text/csv'));
    // Restore
    const rf=el('div','field'); rf.appendChild(el('label',null,'Restore from a JSON backup'));
    const ri=el('input'); ri.type='file'; ri.accept='.json,application/json,text/plain'; ri.style.cssText='font-size:13px;';
    ri.onchange=()=>{ const f=ri.files&&ri.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>restoreFromText(String(rd.result)); rd.onerror=()=>uiInfo('Could not read that file.'); rd.readAsText(f); ri.value=''; };
    rf.appendChild(ri); body.appendChild(rf);
    box.appendChild(head); box.appendChild(body); ov.appendChild(box); document.body.appendChild(ov);
    ov.addEventListener('mousedown',e=>{ if(e.target===ov) ov.remove(); });
  }

  function uiConfirm(message,onYes,yesLabel){
    const ov=el('div','overlay'); ov.style.display='flex'; ov.style.zIndex='140';
    const box=el('div','modal'); box.style.maxWidth='360px';
    box.appendChild(el('div','modal-body','<div>'+esc(message)+'</div>'));
    const foot=el('div','modal-foot'); foot.style.justifyContent='flex-end'; foot.style.gap='8px';
    const cancel=el('button','ghost','Cancel'); const yes=el('button','primary',esc(yesLabel||'Delete')); yes.style.background='var(--danger)'; yes.style.borderColor='var(--danger)';
    foot.appendChild(cancel); foot.appendChild(yes); box.appendChild(foot); ov.appendChild(box); document.body.appendChild(ov);
    cancel.onclick=()=>ov.remove(); ov.addEventListener('mousedown',e=>{ if(e.target===ov) ov.remove(); }); yes.onclick=()=>{ ov.remove(); onYes(); };
  }

  return { start(){ const bf=document.getElementById('bootFail'); if(bf) bf.remove(); wire(); SNBridge.init({ debounceSave:250, onNote:(text)=>{ standalone=false; load(text); }, onStandalone:()=>{ standalone=true; load(''); } }); },
    _test:{ combinedRate, weeklyRates, dowRates, habitMomentum, coOccur, bestPairing, skipCount, journalStats, historyDays, buildAIExport, currentStreak, longestStreak, completionRate, addDays, todayStr,
      totalXP, levelInfo, totalCompletions, perfectDaysAllTime, earnedAchievements, ensureGamSeed, ACHIEVEMENTS,
      isDoneOn, setLog, metricOf, setMetric, metricAgg, workoutHabits, allWorkouts, collectJournal,
      parseGarminCSV, applyImport, guessHabit, allTimeTotals, _get:()=>data, _set:(d)=>{data=d;} } };
})();
